<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PEP Primary Roadmap Metro Preview</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #111827;
        --muted: #475569;
        --panel: rgba(255, 255, 255, 0.86);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
      }

      .preview-shell {
        width: 2048px;
        height: 680px;
        overflow: hidden;
        border-radius: 14px;
        background: linear-gradient(#d9f1ff 0%, #bde5fa 22%, #72c8e6 56%, #38a8c7 100%);
        box-shadow: 0 22px 70px rgba(15, 23, 42, 0.16);
      }

      svg {
        display: block;
        width: 2048px;
        height: 680px;
      }

      .title-zh {
        font-size: 34px;
        font-weight: 950;
        letter-spacing: 0;
        fill: var(--ink);
      }

      .title-en {
        font-size: 16px;
        font-weight: 750;
        fill: #334155;
      }

      .district {
        font-size: 21px;
        font-weight: 950;
        fill: rgba(51, 65, 85, 0.7);
      }

      .district.light {
        fill: rgba(255, 255, 255, 0.96);
        paint-order: stroke;
        stroke: rgba(15, 23, 42, 0.35);
        stroke-width: 3px;
      }

      .grade-chip rect {
        fill: url(#chipGradient);
        stroke: rgba(255, 255, 255, 0.9);
        stroke-width: 3px;
        filter: drop-shadow(0 7px 8px rgba(15, 23, 42, 0.35));
      }

      .grade-chip text {
        fill: #ffffff;
        font-size: 26px;
        font-weight: 950;
      }

      .main-track-shadow,
      .route-shadow {
        stroke: rgba(15, 23, 42, 0.22);
        stroke-width: 14px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .main-track {
        stroke: #22c55e;
        stroke-width: 9px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .main-track-highlight,
      .route-highlight {
        stroke: rgba(255, 255, 255, 0.74);
        stroke-width: 3px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .route {
        stroke-width: 10px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .station .outer {
        fill: #ffffff;
        stroke: #ffffff;
        stroke-width: 7px;
      }

      .station .ring {
        fill: #ffffff;
        stroke: #111827;
        stroke-width: 4px;
      }

      .station .dot {
        fill: currentColor;
      }

      .station.transfer .ring {
        stroke-width: 6px;
      }

      .card rect {
        fill: rgba(255, 255, 255, 0.92);
        stroke: rgba(100, 116, 139, 0.48);
        stroke-width: 1.5px;
        filter: drop-shadow(0 4px 6px rgba(15, 23, 42, 0.2));
      }

      .card .head {
        font-size: 12px;
        font-weight: 950;
        fill: #0f172a;
      }

      .card .line {
        font-size: 9px;
        font-weight: 850;
        fill: #475569;
      }

      .card .route-label {
        font-size: 8px;
        font-weight: 800;
        fill: #64748b;
      }

      .panel {
        fill: var(--panel);
        stroke: rgba(148, 163, 184, 0.65);
        stroke-width: 1.5px;
        filter: drop-shadow(0 12px 18px rgba(15, 23, 42, 0.15));
      }

      .panel-title {
        font-size: 14px;
        font-weight: 950;
        fill: #0f172a;
      }

      .panel-small {
        font-size: 10px;
        font-weight: 750;
        fill: #334155;
      }

      .panel-mini {
        font-size: 8px;
        font-weight: 700;
        fill: #64748b;
      }

      .route-index-line {
        stroke-width: 6px;
        stroke-linecap: round;
      }

      .compass {
        fill: rgba(255, 255, 255, 0.92);
        stroke: rgba(15, 23, 42, 0.32);
        stroke-width: 2px;
      }

      .mini-label {
        font-size: 10px;
        font-weight: 900;
        fill: #334155;
      }
    </style>
  </head>
