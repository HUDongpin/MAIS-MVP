.rel .why{color:var(--dim)}
.bdg{display:grid;place-items:center;width:22px;height:22px;font-size:12px;font-weight:800;color:#070b1e;margin-top:1px}
.bdg.need{border-radius:50%;background:#93c5fd}.bdg.unl{border-radius:6px;background:#fdba74}.bdg.con{border-radius:50%;border:2px dotted #cbd5e1}
.flag{color:#fecdd3;font-weight:700}.lowc{color:#fde68a}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sbtn{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#0d1330;color:var(--ink);font-weight:700;font-size:13px}
.sbtn:hover{border-color:rgba(169,180,214,.5)}
.parts{margin:4px 0 12px;padding:0;list-style:none}
.parts li{margin:2px 0;overflow-wrap:anywhere}
a.off{color:#a5f3fc;display:inline-flex;align-items:center;min-height:44px;overflow-wrap:anywhere}
details.hop>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;overflow-wrap:anywhere}
/* ---- P0b: portals, tree, popover, sheet, cooperative mode ---- */
.portal{position:absolute;left:0;top:0;pointer-events:auto;min-height:44px;min-width:44px;padding:0 10px;border-radius:12px;border:2px solid var(--line);background:rgba(13,19,48,.94);color:var(--ink);font:700 12px var(--mono);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.portal.need{border-color:#93c5fd}.portal.unl{border-color:#fdba74}.portal.con{border-style:dashed;border-color:#cbd5e1}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{padding-left:14px}
.tree li{outline:none}
.tree li:focus-visible{outline:none;box-shadow:none}
.ti{display:flex;align-items:center;gap:6px;min-height:44px;padding:4px 8px;border-radius:10px;cursor:pointer;font-size:13px;overflow-wrap:anywhere;min-width:0}
.ti>span:last-child{min-width:0}
.tree li:focus-visible>.ti{outline:2px solid #fff;outline-offset:-2px;box-shadow:inset 0 0 0 4px #070b1e}
.tree li[aria-selected="true"]>.ti{background:rgba(103,232,249,.14)}
.tw{flex:0 0 14px;color:var(--faint);font-size:12px}
.pop{position:fixed;z-index:35;width:min(380px,calc(100vw - 16px));max-height:calc(100vh - 80px);max-height:calc(100dvh - 80px);overflow:auto;overscroll-behavior:contain;border-radius:14px;background:#0d1330;border:1px solid var(--line)}
.pop .dlg-b{max-height:none}
kbd{font:700 12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:#070b1e;color:var(--ink)}
.sheetbtns{display:none;flex:0 0 auto;gap:6px}
@media (max-width:699px){.sheetbtns{display:flex}}
.sheetbtns button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#0d1330;color:var(--ink);font-size:16px;font-weight:800;padding:0}
.sheetbtns button[aria-disabled="true"]{opacity:.45;cursor:default}
/* short phone viewports and 200–400% browser zoom: an open sheet is one scroll container with its tab bar pinned at the top, so the
   card and every panel stay reachable (WCAG 1.4.10) */
@media (max-width:699px) and (max-height:599px){
  /* the pinned tab bar covers what scrolls under it: scroll-into-view and focus scrolling stop below it (--tabsH is measured by syncSheetInset;
     WCAG 2.4.11), and focusIn() and the sheet's focusin guard do the same where an engine ignores scroll-padding */
  .phost[data-sheet="half"],.phost[data-sheet="full"]{overflow-y:auto;overscroll-behavior:contain;scroll-padding-top:calc(var(--tabsH,53px) + 8px);scroll-padding-bottom:8px}
  .phost[data-sheet="half"]>*,.phost[data-sheet="full"]>*{flex-shrink:0}
  .phost[data-sheet="half"] .tpanels,.phost[data-sheet="full"] .tpanels{flex:0 0 auto;min-height:auto;overflow:visible}
  .phost[data-sheet="half"] .tabs,.phost[data-sheet="full"] .tabs{position:sticky;top:0;z-index:1;background:#0d132f}
}
/* short sheets from 480 px wide (phone landscape, 200% zoom): Expand and Collapse stay pinned at the right end of the pinned tab bar (over
   the peek row while it is scrolled to the top), so the sheet can be resized after focus scrolls the peek row away; the tab bar and the peek
   row keep their right ends free for them. Narrower short sheets keep the buttons in the peek row, so tab labels never truncate */
@media (min-width:480px) and (max-width:699px) and (max-height:599px){
  .phost[data-sheet="half"] .sheetbtns,.phost[data-sheet="full"] .sheetbtns{position:fixed;z-index:2;right:calc(5px + env(safe-area-inset-right))}
  .phost[data-sheet="half"] .sheetbtns{top:calc(50vh + 5px);top:calc(50dvh + 5px)}
  .phost[data-sheet="full"] .sheetbtns{top:57px}
  .phost[data-sheet="half"] .tabs,.phost[data-sheet="full"] .tabs,.phost[data-sheet="half"] .peek,.phost[data-sheet="full"] .peek{padding-right:104px}
}
.handle{touch-action:none}
.stage.coop{touch-action:pan-y}
.stage.coop.engaged{touch-action:none}
html.rm *,html.rm *::before,html.rm *::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* ---- P1: mission HUD, trace, course, filters, legend glyphs, figure mode, print outline ---- */
.mh .code{font-size:13px;color:var(--dim);font-weight:700}
.mh h2.ttl{margin:4px 0;font-size:17px;line-height:1.3;letter-spacing:normal;font-variant-caps:normal;color:var(--ink);font-weight:700;overflow-wrap:anywhere}
.kick svg{vertical-align:-3px;margin-left:6px}
.mh h3.sec,.tpanel h2.sub{margin-top:14px}
.ibar{height:8px;border-radius:6px;background:rgba(169,180,214,.16);overflow:hidden;margin:4px 0 8px}
.ibar i{display:block;height:100%;background:#fbbf24}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0}
.stat>*{min-height:44px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:rgba(169,180,214,.06);color:var(--ink);font-size:12px;font-weight:700;text-align:left;overflow-wrap:anywhere}
.stat button:hover{border-color:rgba(169,180,214,.5)}
.shelf{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.shelf .mini{font-family:var(--mono)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}
.seg .lbl{font-size:12px;color:var(--faint);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.sbtn[aria-pressed="true"]{border-color:#67e8f9;color:#cffafe;background:rgba(103,232,249,.12)}
.fg{border:1px solid var(--line);border-radius:12px;padding:4px 10px 6px;margin:8px 0;min-width:0}
.fg legend{padding:0 4px;font-size:14px;line-height:1.2;letter-spacing:.1em;font-variant-caps:all-small-caps;color:var(--faint);font-weight:800}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:13px;cursor:pointer;overflow-wrap:anywhere;min-width:0}
.chk input{width:20px;height:20px;margin:0;flex:0 0 auto;accent-color:#67e8f9}
.rng{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) minmax(0,auto);align-items:center;gap:8px;min-height:44px;font-size:13px}
.rng input{width:100%;min-width:0;height:44px;margin:0;accent-color:#67e8f9}
.rng output{font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.fsum{font-weight:700;color:var(--ink);margin:0 0 6px;overflow-wrap:anywhere}
.gen{color:var(--faint)}
.lgs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;font-size:13px;margin:6px 0 12px}
.lgs canvas{display:block}
.mini.stc{white-space:normal}
.mini.hid{color:#fecdd3;border-color:rgba(251,113,133,.5);white-space:normal}
.ssum .sbtn{margin-top:6px}
/* List tab: the map's rings, Grand Roads and constellation roads as buttons (A11Y-CANVAS-ONLY-INFO) */
details.maplist{margin:6px 0;border:1px solid var(--line);border-radius:12px;padding:0 10px;min-width:0}
details.maplist>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
details.maplist>.rel{margin:0 0 10px}
.bdg.ring{border-radius:50%;border:2px solid #a9b4d6;width:18px;height:18px;margin:3px 2px 0}
.bdg.bbl{height:0;border-top:3px solid #c7d2fe;margin-top:10px}
/* ---- P2: path between stars, edge ledger, since last visit ---- */
.bdg.path{border-radius:6px;background:#fde68a}
.since{color:#fde68a;font-weight:700}
.pickline{display:block;color:#fde68a;margin-bottom:4px}
.tsv{display:block;width:100%;min-height:160px;margin:6px 0;padding:8px;font:12px/1.35 var(--mono);background:#070b1e;color:var(--ink);border:1px solid var(--line);border-radius:10px;resize:vertical}
.rc th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;color:var(--faint);font-size:12px;font-weight:800;position:sticky;top:-14px;background:#0d1330}
.rc td.lk{overflow-wrap:normal}.rc td.lk b{white-space:nowrap;font-family:var(--mono)}.rc td.lk span{white-space:nowrap;color:var(--dim);font-size:12px}
/* forced colours (§10): kept after every author state rule above, which have the same specificity and would otherwise win over the system
   colours (a pressed .sbtn once rendered #cffafe on a near-white Canvas). State markers survive: a selected tab or pressed toggle fills with
   Highlight; the active search option and the selected tree row carry a thick Highlight bar and frame; progress fills are Highlight in a
   CanvasText frame; badges keep an outline (A11Y-FORCED-COLORS-STATES) */
@media (forced-colors: active){
  .hbtn,.tab,.zoom button,.handle,.menu button,.sbtn,.stat button{border:1px solid ButtonText;background:ButtonFace;color:ButtonText}
  .tab[aria-selected="true"],.sbtn[aria-pressed="true"],.hbtn[aria-pressed="true"]{forced-color-adjust:none;background:Highlight;color:HighlightText;border-color:Highlight}
  .tab[aria-selected="true"] *,.sbtn[aria-pressed="true"] *,.hbtn[aria-pressed="true"] *{color:HighlightText!important}
  .tab[aria-selected="true"]:focus-visible,.sbtn[aria-pressed="true"]:focus-visible,.hbtn[aria-pressed="true"]:focus-visible{outline:2px solid CanvasText;outline-offset:2px}
  .sopt[aria-selected="true"],.tree li[aria-selected="true"]>.ti{outline:2px solid Highlight;outline-offset:-2px;border-left:8px solid Highlight}
  .ibar,.sbar{border:1px solid CanvasText}
  .ibar i,.sbar i{forced-color-adjust:none;background:Highlight!important}
  .bdg,.lg .dot{border:1px solid CanvasText}
}
.printout{display:none}
html.figure .hdr,html.figure .railL,html.figure .phost,html.figure .ovl,html.figure .portals,html.figure .tip,html.figure .devov{visibility:hidden!important}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff;color:#000}
  .app,.menu,dialog,.pop,.sres,.devov,.skip,#live,.fatal,canvas{display:none!important}
  .printout{display:block;font:12px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:#000;padding:0 6mm}
  .printout h1{font-size:18px;margin:0 0 6px}.printout h2{font-size:15px;margin:14px 0 4px;break-after:avoid}
  .printout h3{font-size:13px;margin:8px 0 2px;break-after:avoid}.printout h4{font-size:12px;margin:6px 0 2px;font-weight:600;break-after:avoid}
  .printout ul{margin:0 0 4px;padding-left:14px}.printout li{break-inside:avoid;margin:2px 0}.printout .u{color:#333;font-size:10px;overflow-wrap:anywhere}
  .printout .attr{margin:6px 0 10px;padding:4px 0;border-top:1px solid #999;border-bottom:1px solid #999;font-size:10px;color:#222;overflow-wrap:anywhere}
}
</style>

<script>
(function () {
"use strict";
const T_START = performance.now();

/* ======================================================================
   §A  Utilities and the copy table (§11: the only source of visible sentences)
   ====================================================================== */
const Q = new URLSearchParams(location.search);
const FLAG = k => Q.has(k) && Q.get(k) !== "0";
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => (v < a || v !== v ? a : v > b ? b : v); // NaN clamps to the lower bound, so a broken value never spreads (INT-04)
const DEG = Math.PI / 180;

const hex8 = n => (n >>> 0).toString(16).padStart(8, "0");
const deepFreeze = o => { if (o && typeof o === "object" && !Object.isFrozen(o)) { Object.freeze(o); for (const v of Object.values(o)) deepFreeze(v); } return o; };

    c.members.push(s.i); if (!c.rings.includes(s.ring)) c.rings.push(s.ring);

    let pc = pieceBy.get(pk);
