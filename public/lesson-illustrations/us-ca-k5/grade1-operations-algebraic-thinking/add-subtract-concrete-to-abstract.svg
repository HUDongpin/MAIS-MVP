<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Concrete sticker groups become an abstract addition equation</title>
  <desc id="desc">Eight blue stickers and three green stickers are joined, counted as eleven, and written as 8 + 3 = 11.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <symbol id="sticker" viewBox="-48 -48 96 96">
      <path d="M0-45 11-16 42-25 24 1 45 23 14 20 8 45-11 18-39 31-23 3-45-13-13-16Z" fill="currentColor"/>
      <circle cx="-11" cy="-8" r="7" fill="#ffffff" opacity="0.5"/>
      <circle cx="17" cy="13" r="5" fill="#ffffff" opacity="0.35"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="154" cy="124" r="74" fill="#22d3ee" opacity="0.14"/>
  <circle cx="1434" cy="782" r="92" fill="#8b5cf6" opacity="0.11"/>
  <circle cx="1318" cy="110" r="42" fill="#facc15" opacity="0.24"/>

  <g filter="url(#softShadow)">
    <rect x="90" y="78" width="1420" height="744" rx="48" fill="#ffffff" stroke="#cffafe" stroke-width="6"/>
  </g>

  <text x="800" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900" fill="#0f172a">
    From concrete groups to an abstract equation
  </text>
  <text x="800" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#475569">
    Name the parts, join them, and check the total.
  </text>

  <g transform="translate(150 286)">
    <rect x="0" y="0" width="480" height="390" rx="34" fill="#f8fafc" stroke="#bae6fd" stroke-width="5"/>
    <text x="240" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#075985">
      8 stickers
    </text>
    <g color="#38bdf8">
      <use href="#sticker" x="62" y="126" width="76" height="76"/>
      <use href="#sticker" x="164" y="126" width="76" height="76"/>
      <use href="#sticker" x="266" y="126" width="76" height="76"/>
      <use href="#sticker" x="368" y="126" width="76" height="76"/>
      <use href="#sticker" x="62" y="254" width="76" height="76"/>
      <use href="#sticker" x="164" y="254" width="76" height="76"/>
      <use href="#sticker" x="266" y="254" width="76" height="76"/>
      <use href="#sticker" x="368" y="254" width="76" height="76"/>
    </g>
  </g>

  <g transform="translate(690 286)">
    <rect x="0" y="0" width="250" height="390" rx="34" fill="#f7fee7" stroke="#bbf7d0" stroke-width="5"/>
    <text x="125" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#166534">
      3 more
    </text>
    <g color="#22c55e">
      <use href="#sticker" x="84" y="132" width="84" height="84"/>
      <use href="#sticker" x="44" y="256" width="84" height="84"/>
      <use href="#sticker" x="126" y="256" width="84" height="84"/>
    </g>
  </g>

  <path d="M990 482 C1056 482 1088 482 1152 482" fill="none" stroke="url(#bridge)" stroke-width="16" stroke-linecap="round"/>
  <path d="M1152 482 1118 452 M1152 482 1118 512" fill="none" stroke="#7c3aed" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(1180 286)" filter="url(#softShadow)">
    <rect x="0" y="0" width="270" height="390" rx="34" fill="#faf5ff" stroke="#ddd6fe" stroke-width="5"/>
    <text x="135" y="66" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="900" fill="#5b21b6">
      Abstract
    </text>
    <rect x="34" y="116" width="202" height="128" rx="28" fill="#ffffff" stroke="#c4b5fd" stroke-width="4"/>
    <text x="135" y="198" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900" fill="#0f172a">
      8 + 3
    </text>
    <rect x="34" y="278" width="202" height="70" rx="22" fill="#ede9fe"/>
    <text x="135" y="326" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#5b21b6">
      = 11
    </text>
  </g>

  <g transform="translate(245 724)">
    <rect x="0" y="0" width="1110" height="56" rx="28" fill="#e0f2fe" stroke="#bae6fd" stroke-width="3"/>
    <text x="555" y="38" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">
      Concrete: 8 and 3 stickers. Abstract: 8 + 3 = 11.
    </text>
  </g>
</svg>
