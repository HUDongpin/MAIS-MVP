<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Lena has 7 stickers and gets 4 more</title>
  <desc id="desc">Seven stickers are on Lena's page. Four more stickers come from an envelope. Together they make eleven stickers, shown by 7 + 4 = 11.</desc>
  <defs>
    <linearGradient id="pageBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="56%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <symbol id="starSticker" viewBox="-45 -45 90 90">
      <path d="M0-42 12-13 43-12 20 8 28 39 0 23-28 39-20 8-43-12-12-13Z" fill="currentColor"/>
      <circle cx="-10" cy="-9" r="6" fill="#ffffff" opacity="0.52"/>
      <circle cx="15" cy="12" r="4" fill="#ffffff" opacity="0.35"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#pageBackground)"/>
  <circle cx="146" cy="128" r="74" fill="#38bdf8" opacity="0.16"/>
  <circle cx="1452" cy="150" r="54" fill="#facc15" opacity="0.22"/>
  <circle cx="1398" cy="760" r="104" fill="#22c55e" opacity="0.12"/>

  <g filter="url(#softShadow)">
    <rect x="92" y="72" width="1416" height="752" rx="46" fill="#ffffff" stroke="#bae6fd" stroke-width="6"/>
  </g>

  <text x="800" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="900" fill="#0f172a">
    Lena has 7 stickers and gets 4 more
  </text>
  <text x="800" y="206" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#475569">
    Count the stickers she starts with, then add the new stickers.
  </text>

  <g transform="translate(150 275)">
    <rect x="0" y="0" width="560" height="382" rx="36" fill="#f8fafc" stroke="#bae6fd" stroke-width="5"/>
    <rect x="52" y="74" width="456" height="250" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <text x="280" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="#075985">
      Lena starts with 7 stickers
    </text>
    <g color="#38bdf8">
      <use href="#starSticker" x="84" y="104" width="76" height="76"/>
      <use href="#starSticker" x="190" y="104" width="76" height="76"/>
      <use href="#starSticker" x="296" y="104" width="76" height="76"/>
      <use href="#starSticker" x="402" y="104" width="76" height="76"/>
      <use href="#starSticker" x="84" y="216" width="76" height="76"/>
      <use href="#starSticker" x="190" y="216" width="76" height="76"/>
      <use href="#starSticker" x="296" y="216" width="76" height="76"/>
    </g>
    <text x="280" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#0f172a">
      7 stickers
    </text>
  </g>

  <g transform="translate(775 308)">
    <path d="M0 162 C76 162 126 162 210 162" fill="none" stroke="url(#arrowGradient)" stroke-width="16" stroke-linecap="round"/>
    <path d="M210 162 174 130 M210 162 174 194" fill="none" stroke="#16a34a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-24" y="24" width="188" height="100" rx="24" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="5"/>
    <text x="70" y="-18" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" fill="#166534">
      gets 4 more
    </text>
    <g color="#22c55e">
      <use href="#starSticker" x="-12" y="50" width="44" height="44"/>
      <use href="#starSticker" x="31" y="50" width="44" height="44"/>
      <use href="#starSticker" x="74" y="50" width="44" height="44"/>
      <use href="#starSticker" x="117" y="50" width="44" height="44"/>
    </g>
  </g>

  <g transform="translate(1040 275)">
    <rect x="0" y="0" width="410" height="382" rx="36" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="5"/>
    <text x="205" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="#166534">
      Now Lena has 11 stickers
    </text>
    <g color="#38bdf8">
      <use href="#starSticker" x="48" y="88" width="58" height="58"/>
      <use href="#starSticker" x="136" y="88" width="58" height="58"/>
      <use href="#starSticker" x="224" y="88" width="58" height="58"/>
      <use href="#starSticker" x="312" y="88" width="58" height="58"/>
      <use href="#starSticker" x="48" y="178" width="58" height="58"/>
      <use href="#starSticker" x="136" y="178" width="58" height="58"/>
      <use href="#starSticker" x="224" y="178" width="58" height="58"/>
    </g>
    <g color="#22c55e">
      <use href="#starSticker" x="48" y="268" width="58" height="58"/>
      <use href="#starSticker" x="136" y="268" width="58" height="58"/>
      <use href="#starSticker" x="224" y="268" width="58" height="58"/>
      <use href="#starSticker" x="312" y="268" width="58" height="58"/>
    </g>
  </g>

  <g transform="translate(310 710)">
    <rect x="0" y="0" width="980" height="70" rx="35" fill="#e0f2fe" stroke="#bae6fd" stroke-width="4"/>
    <text x="490" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="900" fill="#0f172a">
      7 stickers + 4 more stickers = 11 stickers
    </text>
  </g>
</svg>
