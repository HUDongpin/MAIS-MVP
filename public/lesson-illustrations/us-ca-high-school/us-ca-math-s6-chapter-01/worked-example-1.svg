<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Quantities, Units, and Precision - Worked example 1</title>
  <desc id="desc">A rectangle is measured as 2.4 m by 1.5 m. Find the area with square-meter units. Answer: area = 3.6 m^2.</desc>
  <rect width="1600" height="900" fill="#eef4fb"/>
  <rect x="24" y="24" width="1552" height="852" rx="28" fill="#f8fbff" stroke="#b8c8de" stroke-width="2"/>
  <text x="54" y="76" font-size="36" font-weight="900" fill="#162033">S6 Quantities, Units, and Precision</text>
  <text x="54" y="112" font-size="20" font-weight="700" fill="#5a6c85">units-diagram / svg-katex / review-ready exact layer</text>
  <text class="" x="54" y="160" font-size="23" font-weight="650" fill="#18212f"><tspan x="54" dy="0">EN: A rectangle is measured as 2.4 m by 1.5 m. Find the area with square-meter units.</tspan></text>
  <text class="" x="54" y="222" font-size="22" font-weight="600" fill="#334155"><tspan x="54" dy="0">ZH: 一個長方形量得長 2.4 m、寬 1.5 m。求面積，並使用平方公尺單位。</tspan></text>
  <rect x="54" y="292" width="820" height="540" rx="22" fill="#ffffff" stroke="#c8d4e8" stroke-width="2"/>
  <text x="82" y="338" font-size="24" font-weight="800" fill="#20314d">Deterministic Visual Layer</text>
  <line x1="78" y1="360" x2="850" y2="360" stroke="#d9e4f5" stroke-width="2"/>
  <rect x="190" y="400" width="420" height="260" fill="#f8fbff" stroke="#2563eb" stroke-width="5"/>
    <text x="330" y="388" font-size="28" font-weight="900" fill="#20314d">2.4 m</text>
    <text x="625" y="540" font-size="28" font-weight="900" fill="#20314d">1.5 m</text>
    <text x="230" y="720" font-size="30" font-weight="900" fill="#0f766e">area = 3.6 m^2.</text>
  <rect x="920" y="292" width="620" height="540" rx="22" fill="#ffffff" stroke="#c8d4e8" stroke-width="2"/>
  <text x="948" y="338" font-size="24" font-weight="800" fill="#20314d">Exact Checks And Answer</text>
  <line x1="944" y1="360" x2="1516" y2="360" stroke="#d9e4f5" stroke-width="2"/>
  <text class="" x="950" y="380" font-size="24" font-weight="700" fill="#20314d"><tspan x="950" dy="0">2.4 * 1.5 = 3.6</tspan></text>
  <rect x="950" y="588" width="540" height="152" rx="18" fill="#e9fbf3" stroke="#80cfa3" stroke-width="2"/>
  <text x="978" y="632" font-size="26" font-weight="900" fill="#0f766e">Answer</text>
  <text class="" x="978" y="674" font-size="27" font-weight="900" fill="#0f766e"><tspan x="978" dy="0">area = 3.6 m^2.</tspan></text>
  <text class="" x="950" y="786" font-size="21" font-weight="650" fill="#334155"><tspan x="950" dy="0">zhHans: 面积 = 3.6 m^2。</tspan></text>
</svg>
