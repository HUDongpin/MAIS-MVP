  <title id="title">Linear and Quadratic Models - Worked example 2</title>
  <desc id="desc">A ball height is h(t) = -16t^2 + 48t + 5. Find the maximum height time using the vertex. Answer: The vertex time is 1.5 seconds and h(1.5) = 41.</desc>
