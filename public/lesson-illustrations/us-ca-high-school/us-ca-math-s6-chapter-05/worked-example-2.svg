  <title id="title">Capstone Modeling - Worked example 2</title>
  <desc id="desc">Revenue is R(p) = p(120 - 4p). Find the price p that maximizes revenue and the maximum revenue. Answer: p = 15; maximum revenue = 900.</desc>
