  <text x="54" y="112" font-size="20" font-weight="700" fill="#5a6c85">coordinate-plane / svg / review-ready exact layer</text>
  <text class="" x="54" y="160" font-size="23" font-weight="650" fill="#18212f"><tspan x="54" dy="0">EN: Points A(-2, 3) and B(4, 7) define a segment. Find the slope and midpoint.</tspan></text>
  <text class="" x="54" y="222" font-size="22" font-weight="600" fill="#334155"><tspan x="54" dy="0">ZH: 點 A(-2, 3) 和 B(4, 7) 確定一條線段。求斜率和中點。</tspan></text>
