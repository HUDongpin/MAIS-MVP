  <title id="title">Coordinate Geometry Methods - Worked example 1</title>
  <desc id="desc">Points A(-2, 3) and B(4, 7) define a segment. Find the slope and midpoint. Answer: slope = 2/3; midpoint = (1, 5).</desc>
  <rect width="1600" height="900" fill="#eef4fb"/>
