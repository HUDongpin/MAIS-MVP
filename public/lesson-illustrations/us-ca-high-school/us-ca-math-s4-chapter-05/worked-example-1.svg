<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Conditional Probability - Worked example 1</title>
  <desc id="desc">In a two-way table, 12 students ride the bus and 8 of those also attend tutoring. Find P(tutoring | bus). Answer: P(tutoring | bus) = 8/12 = 2/3.</desc>
  <rect width="1600" height="900" fill="#eef4fb"/>
  <rect x="24" y="24" width="1552" height="852" rx="28" fill="#f8fbff" stroke="#b8c8de" stroke-width="2"/>
  <text x="54" y="76" font-size="36" font-weight="900" fill="#162033">S4 Conditional Probability</text>
  <text x="54" y="112" font-size="20" font-weight="700" fill="#5a6c85">probability-table / svg / review-ready exact layer</text>
  <text class="" x="54" y="160" font-size="23" font-weight="650" fill="#18212f"><tspan x="54" dy="0">EN: In a two-way table, 12 students ride the bus and 8 of those also attend tutoring. Find P(tutoring |</tspan><tspan x="54" dy="28">bus).</tspan></text>
  <text class="" x="54" y="222" font-size="22" font-weight="600" fill="#334155"><tspan x="54" dy="0">ZH: 在一個雙向表中，12 名學生乘校車，其中 8 人也參加輔導。求 P(參加輔導 | 乘校車)。</tspan></text>
  <rect x="54" y="292" width="820" height="540" rx="22" fill="#ffffff" stroke="#c8d4e8" stroke-width="2"/>
  <text x="82" y="338" font-size="24" font-weight="800" fill="#20314d">Deterministic Visual Layer</text>
  <line x1="78" y1="360" x2="850" y2="360" stroke="#d9e4f5" stroke-width="2"/>
  <rect x="86" y="340" width="700" height="70" fill="#e9f2ff" stroke="#9fb1cc"/>
      <text x="110" y="384" font-size="24" font-weight="800" fill="#20314d">Exact item</text>
      <text x="520" y="384" font-size="24" font-weight="800" fill="#0f766e">Value</text>
<rect x="86" y="410" width="700" height="70" fill="#ffffff" stroke="#9fb1cc"/>
      <text x="110" y="454" font-size="24" font-weight="600" fill="#20314d">8 / 12</text>
      <text x="520" y="454" font-size="24" font-weight="700" fill="#0f766e">0.6666666666666666</text>
<rect x="86" y="480" width="700" height="70" fill="#ffffff" stroke="#9fb1cc"/>
      <text x="110" y="524" font-size="24" font-weight="600" fill="#20314d">Answer</text>
      <text x="520" y="524" font-size="24" font-weight="700" fill="#0f766e">P(tutoring | bus) = 8/12 = 2/3.</text>
  <rect x="920" y="292" width="620" height="540" rx="22" fill="#ffffff" stroke="#c8d4e8" stroke-width="2"/>
  <text x="948" y="338" font-size="24" font-weight="800" fill="#20314d">Exact Checks And Answer</text>
  <line x1="944" y1="360" x2="1516" y2="360" stroke="#d9e4f5" stroke-width="2"/>
  <text class="" x="950" y="380" font-size="24" font-weight="700" fill="#20314d"><tspan x="950" dy="0">8 / 12 = 0.6666666666666666</tspan></text>
  <rect x="950" y="588" width="540" height="152" rx="18" fill="#e9fbf3" stroke="#80cfa3" stroke-width="2"/>
  <text x="978" y="632" font-size="26" font-weight="900" fill="#0f766e">Answer</text>
  <text class="" x="978" y="674" font-size="27" font-weight="900" fill="#0f766e"><tspan x="978" dy="0">P(tutoring | bus) = 8/12 = 2/3.</tspan></text>
  <text class="" x="950" y="786" font-size="21" font-weight="650" fill="#334155"><tspan x="950" dy="0">zhHans: P(参加辅导 | 乘校车) = 8/12 =</tspan><tspan x="950" dy="28">2/3。</tspan></text>
</svg>
