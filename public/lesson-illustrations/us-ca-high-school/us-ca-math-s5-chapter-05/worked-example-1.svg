<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Statistical Inference and Claims - Worked example 1</title>
  <desc id="desc">A sample proportion is 0.56 with margin of error 0.08. Give the confidence interval. Answer: interval = [0.48, 0.64].</desc>
  <rect width="1600" height="900" fill="#eef4fb"/>
  <rect x="24" y="24" width="1552" height="852" rx="28" fill="#f8fbff" stroke="#b8c8de" stroke-width="2"/>
  <text x="54" y="76" font-size="36" font-weight="900" fill="#162033">S5 Statistical Inference and Claims</text>
  <text x="54" y="112" font-size="20" font-weight="700" fill="#5a6c85">interval-diagram / svg / review-ready exact layer</text>
  <text class="" x="54" y="160" font-size="23" font-weight="650" fill="#18212f"><tspan x="54" dy="0">EN: A sample proportion is 0.56 with margin of error 0.08. Give the confidence interval.</tspan></text>
  <text class="" x="54" y="222" font-size="22" font-weight="600" fill="#334155"><tspan x="54" dy="0">ZH: 樣本比例為 0.56，誤差範圍為 0.08。寫出信賴區間。</tspan></text>
  <rect x="54" y="292" width="820" height="540" rx="22" fill="#ffffff" stroke="#c8d4e8" stroke-width="2"/>
  <text x="82" y="338" font-size="24" font-weight="800" fill="#20314d">Deterministic Visual Layer</text>
  <line x1="78" y1="360" x2="850" y2="360" stroke="#d9e4f5" stroke-width="2"/>
  <line x1="130" y1="515" x2="730" y2="515" stroke="#20314d" stroke-width="6"/>
  <circle cx="270" cy="515" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
  <circle cx="590" cy="515" r="14" fill="#2563eb" stroke="#2563eb" stroke-width="5"/>
  <line x1="270" y1="515" x2="590" y2="515" stroke="#2563eb" stroke-width="12"/>
  <text x="246" y="565" font-size="24" font-weight="800" fill="#2563eb">left</text>
  <text x="558" y="565" font-size="24" font-weight="800" fill="#2563eb">right</text>
  <text x="120" y="670" font-size="30" font-weight="900" fill="#0f766e">interval = [0.48, 0.64].</text>
  <rect x="920" y="292" width="620" height="540" rx="22" fill="#ffffff" stroke="#c8d4e8" stroke-width="2"/>
  <text x="948" y="338" font-size="24" font-weight="800" fill="#20314d">Exact Checks And Answer</text>
  <line x1="944" y1="360" x2="1516" y2="360" stroke="#d9e4f5" stroke-width="2"/>
  <text class="" x="950" y="380" font-size="24" font-weight="700" fill="#20314d"><tspan x="950" dy="0">0.56 - 0.08 = 0.48</tspan><tspan x="950" dy="34">0.56 + 0.08 = 0.64</tspan></text>
  <rect x="950" y="588" width="540" height="152" rx="18" fill="#e9fbf3" stroke="#80cfa3" stroke-width="2"/>
  <text x="978" y="632" font-size="26" font-weight="900" fill="#0f766e">Answer</text>
  <text class="" x="978" y="674" font-size="27" font-weight="900" fill="#0f766e"><tspan x="978" dy="0">interval = [0.48, 0.64].</tspan></text>
  <text class="" x="950" y="786" font-size="21" font-weight="650" fill="#334155"><tspan x="950" dy="0">zhHans: 区间 = [0.48, 0.64]。</tspan></text>
</svg>
