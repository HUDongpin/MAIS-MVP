<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Congruence and Proof - Worked example 1</title>
  <desc id="desc">Triangles ABC and DEF have AB = DE, AC = DF, and angle A = angle D. Name the congruence reason. Answer: Triangle ABC is congruent to triangle DEF by SAS.</desc>
  <rect width="1600" height="900" fill="#eef4fb"/>
  <rect x="24" y="24" width="1552" height="852" rx="28" fill="#f8fbff" stroke="#b8c8de" stroke-width="2"/>
  <text x="54" y="76" font-size="36" font-weight="900" fill="#162033">S4 Congruence and Proof</text>
  <text x="54" y="112" font-size="20" font-weight="700" fill="#5a6c85">geometry-proof / svg / review-ready exact layer</text>
  <text class="" x="54" y="160" font-size="23" font-weight="650" fill="#18212f"><tspan x="54" dy="0">EN: Triangles ABC and DEF have AB = DE, AC = DF, and angle A = angle D. Name the congruence reason.</tspan></text>
  <text class="" x="54" y="222" font-size="22" font-weight="600" fill="#334155"><tspan x="54" dy="0">ZH: 三角形 ABC 和 DEF 滿足 AB = DE、AC = DF，且角 A = 角 D。說明全等理由。</tspan></text>
  <rect x="54" y="292" width="820" height="540" rx="22" fill="#ffffff" stroke="#c8d4e8" stroke-width="2"/>
  <text x="82" y="338" font-size="24" font-weight="800" fill="#20314d">Deterministic Visual Layer</text>
  <line x1="78" y1="360" x2="850" y2="360" stroke="#d9e4f5" stroke-width="2"/>
  <polygon points="160,670 420,670 255,410" fill="#f8fbff" stroke="#2563eb" stroke-width="5"/>
  <polygon points="500,670 760,670 595,410" fill="#fff9f2" stroke="#d9480f" stroke-width="5"/>
  <text x="245" y="398" font-size="26" font-weight="800" fill="#20314d">A</text>
  <text x="145" y="704" font-size="26" font-weight="800" fill="#20314d">B</text>
  <text x="420" y="704" font-size="26" font-weight="800" fill="#20314d">C</text>
  <text x="585" y="398" font-size="26" font-weight="800" fill="#20314d">D</text>
  <text x="485" y="704" font-size="26" font-weight="800" fill="#20314d">E</text>
  <text x="760" y="704" font-size="26" font-weight="800" fill="#20314d">F</text>
  <text x="130" y="752" font-size="28" font-weight="900" fill="#0f766e">Triangle ABC is congruent to triangle DEF by SAS.</text>
  <rect x="920" y="292" width="620" height="540" rx="22" fill="#ffffff" stroke="#c8d4e8" stroke-width="2"/>
  <text x="948" y="338" font-size="24" font-weight="800" fill="#20314d">Exact Checks And Answer</text>
  <line x1="944" y1="360" x2="1516" y2="360" stroke="#d9e4f5" stroke-width="2"/>
  <text class="" x="950" y="380" font-size="24" font-weight="700" fill="#20314d"><tspan x="950" dy="0">manual proof/check = Triangle ABC is</tspan><tspan x="950" dy="34">congruent to triangle DEF by SAS.</tspan></text>
  <rect x="950" y="588" width="540" height="152" rx="18" fill="#e9fbf3" stroke="#80cfa3" stroke-width="2"/>
  <text x="978" y="632" font-size="26" font-weight="900" fill="#0f766e">Answer</text>
  <text class="" x="978" y="674" font-size="27" font-weight="900" fill="#0f766e"><tspan x="978" dy="0">Triangle ABC is congruent to</tspan><tspan x="978" dy="32">triangle DEF by SAS.</tspan></text>
  <text class="" x="950" y="786" font-size="21" font-weight="650" fill="#334155"><tspan x="950" dy="0">zhHans: 三角形 ABC 与三角形 DEF 由 SAS</tspan><tspan x="950" dy="28">全等。</tspan></text>
</svg>
