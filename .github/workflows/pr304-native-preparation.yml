name: PR304 native receipt preparation

on:
  pull_request:

permissions:
  contents: read

jobs:
  prepare-native-receipts:
    if: ${{ github.repository == 'HUDongpin/MAIS-MVP' && github.event.pull_request.number == 304 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: "4"
      GIT_CONFIG_KEY_0: gc.auto
      GIT_CONFIG_VALUE_0: "0"
      GIT_CONFIG_KEY_1: gc.autoDetach
      GIT_CONFIG_VALUE_1: "false"
      GIT_CONFIG_KEY_2: maintenance.auto
      GIT_CONFIG_VALUE_2: "false"
      GIT_CONFIG_KEY_3: maintenance.autoDetach
      GIT_CONFIG_VALUE_3: "false"
    steps:
      - name: Check out the immutable execution commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c658ab248e5869e0250a26158214da55cbf40993
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked verification dependencies
        run: npm ci --ignore-scripts

      - name: Execute the complete frozen native chain
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = c658ab248e5869e0250a26158214da55cbf40993
          artifacts="$RUNNER_TEMP/pr304-native-preparation"
          test ! -e "$artifacts" && test ! -L "$artifacts"
          install -d -m 0700 "$artifacts"
          entry=coordination/integration/ca-textbook-successor/promotion.mjs
          manifest=coordination/integration/ca-textbook-successor/attempts/ca-textbook-001/manifest.json
          git rev-parse HEAD > "$artifacts/execution-head.txt"
          node --version > "$artifacts/node-version.txt"
          git --version > "$artifacts/git-version.txt"
          run_native() {
            local label="$1"
            shift
            local started finished status
            started=$(date +%s)
            set +e
            env -u NODE_OPTIONS -u NODE_PATH node "$entry" "$@" \
              > "$artifacts/$label.json" 2> "$artifacts/$label.stderr"
            status=$?
            set -e
            finished=$(date +%s)
            printf '%s\n' "$status" > "$artifacts/$label.exit-code.txt"
            printf '%s\n' "$((finished-started))" > "$artifacts/$label.elapsed-seconds.txt"
            test "$status" -eq 0
          }
          run_native validate validate --repo "$GITHUB_WORKSPACE" --manifest "$manifest"
          run_native canonical shadow --repo "$GITHUB_WORKSPACE" --manifest "$manifest" \
            --run-id "ca304-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-canonical" --execute
          run_native fresh shadow --repo "$GITHUB_WORKSPACE" --manifest "$manifest" \
            --run-id "ca304-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-fresh" --execute
          run_native replay shadow --repo "$GITHUB_WORKSPACE" --manifest "$manifest" \
            --run-id "ca304-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-replay" --execute
          set +e
          env -u NODE_OPTIONS -u NODE_PATH node --input-type=module - "$artifacts" \
            > "$artifacts/comparison.stdout" 2> "$artifacts/comparison.stderr" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {parsePromotionWorkflowJsonBytes as parse} from './scripts/promotion-workflow-json-guard.mjs';
          import {compareReceipts} from './coordination/integration/ca-textbook-successor/receipts.mjs';
          const root=process.argv[2];
          const validation=parse(fs.readFileSync(path.join(root,'validate.json')));
          if(validation.result!=='pass'||validation.liveAllowed!==false)throw new Error('PREPARATION_VALIDATE');
          if(validation.proof.executionCommit!=='c658ab248e5869e0250a26158214da55cbf40993')throw new Error('PREPARATION_EXECUTION');
          const receipts=['canonical','fresh','replay'].map(name=>parse(fs.readFileSync(path.join(root,name+'.json'))));
          const expectedIds=['canonical','fresh','replay'].map(name=>`ca304-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}-${name}`);
          if(receipts.some((receipt,index)=>receipt.runId!==expectedIds[index]))throw new Error('PREPARATION_RUN_ID');
          const comparison=compareReceipts(receipts,validation.proof);
          fs.writeFileSync(path.join(root,'comparison.json'),JSON.stringify(comparison)+'\n',{flag:'wx'});
          fs.writeFileSync(path.join(root,'preparation-context.json'),JSON.stringify({
            schemaVersion:'pr304-native-preparation-context.v1',
            repository:process.env.GITHUB_REPOSITORY,event:process.env.GITHUB_EVENT_NAME,
            runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,
            executionCommit:validation.proof.executionCommit,
            purpose:'receipt-preparation-only',finalPullRequestAccepted:false,
            deploymentPerformed:false,liveAllowed:false
          })+'\n',{flag:'wx'});
          JS
          comparison_status=$?
          set -e
          printf '%s\n' "$comparison_status" > "$artifacts/comparison.exit-code.txt"
          test "$comparison_status" -eq 0
          test "$(git rev-parse HEAD)" = c658ab248e5869e0250a26158214da55cbf40993
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Preserve native outputs including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr304-native-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr304-native-preparation
          if-no-files-found: warn
          retention-days: 14
