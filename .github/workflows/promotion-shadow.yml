name: promotion-shadow-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-shadow-gate:
    name: promotion-shadow-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROMOTION_MANIFEST: coordination/integration/pilots/us-ca-math-rag-v2-g6-ratios-v1/promotion-manifest.v1.json
      PROMOTION_CANONICAL_RECEIPT: coordination/integration/pilots/us-ca-math-rag-v2-g6-ratios-v1/shadow-receipt.v1.json
      PROMOTION_VALIDATION_REPORT: ${{ runner.temp }}/promotion-validation-report.v1.json
      PROMOTION_FRESH_RECEIPT: ${{ runner.temp }}/promotion-shadow-receipt.v1.json
      PROMOTION_REPLAY_RECEIPT: ${{ runner.temp }}/promotion-shadow-replay-receipt.v1.json
      PROMOTION_FRESH_VERIFICATION_REPORT: ${{ runner.temp }}/promotion-fresh-receipt-verification.v1.json
      PROMOTION_REPLAY_VERIFICATION_REPORT: ${{ runner.temp }}/promotion-replay-receipt-verification.v1.json
      PROMOTION_CANONICAL_VERIFICATION_REPORT: ${{ runner.temp }}/promotion-canonical-receipt-verification.v1.json
      PROMOTION_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      PROMOTION_REPLAY_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-replay
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run Promotion Gate unit and security tests
        run: npm run test:promotion-gate

      - name: Validate real pilot, legacy 492-question ratchet, and selected-candidate live reachability
        run: npm --silent run promotion:validate -- --manifest "$PROMOTION_MANIFEST" --json > "$PROMOTION_VALIDATION_REPORT"

      - name: Assert validation report schema and required checks
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const [reportPath, manifestPath] = process.argv.slice(1);
            if (!reportPath || !manifestPath) throw new Error("Validation report and manifest paths are required.");
            const report = JSON.parse(readFileSync(reportPath, "utf8"));
            const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
            const assertExactKeys = (value, expectedKeys, label) => {
              if (!value || typeof value !== "object" || Array.isArray(value)) {
                throw new Error(`${label} must be an object.`);
              }
              const actualKeys = Object.keys(value).sort();
              const sortedExpectedKeys = [...expectedKeys].sort();
              if (JSON.stringify(actualKeys) !== JSON.stringify(sortedExpectedKeys)) {
                throw new Error(`${label} fields must be exactly ${sortedExpectedKeys.join(", ")}.`);
              }
            };
            assertExactKeys(
              report,
              ["schemaVersion", "result", "manifestDigest", "candidateDigest", "checks"],
              "validation report"
            );
            if (report.schemaVersion !== "promotion-validation.v1") {
              throw new Error(`Unexpected validation schema ${report.schemaVersion}.`);
            }
            if (report.result !== "pass") throw new Error(`Validation result must be pass, received ${report.result}.`);
            for (const digestName of ["manifestDigest", "candidateDigest"]) {
              if (typeof report[digestName] !== "string" || !/^[a-f0-9]{64}$/.test(report[digestName])) {
                throw new Error(`${digestName} must be a lowercase SHA-256 digest.`);
              }
            }
            if (report.candidateDigest !== manifest.candidateDigest) {
              throw new Error("Validation candidateDigest does not match the manifest candidateDigest.");
            }
            const expectedCheckIds = [
              "manifest-contract",
              "candidate-integrity",
              "evidence-currentness",
              "mapping-compatibility",
              "rollback-rehearsal",
              "live-reachability",
              "forbidden-diff",
              "legacy-ratchet"
            ];
            if (
              !Array.isArray(manifest.allowlistedCheckIds) ||
              JSON.stringify(manifest.allowlistedCheckIds) !== JSON.stringify(expectedCheckIds)
            ) {
              throw new Error("Manifest allowlistedCheckIds must match the exact ordered v1 check set.");
            }
            if (!Array.isArray(report.checks) || report.checks.length !== expectedCheckIds.length) {
              throw new Error(`Validation checks must contain exactly ${expectedCheckIds.length} results.`);
            }
            const seenCheckIds = new Set();
            for (const [index, check] of report.checks.entries()) {
              assertExactKeys(check, ["checkId", "result"], `validation checks[${index}]`);
              if (check.checkId !== expectedCheckIds[index]) {
                throw new Error(`Validation check ${index} must be ${expectedCheckIds[index]}, received ${check.checkId}.`);
              }
              if (seenCheckIds.has(check.checkId)) throw new Error(`Duplicate validation check ${check.checkId}.`);
              seenCheckIds.add(check.checkId);
              if (check.result !== "pass") {
                throw new Error(`Validation check ${check.checkId} must pass, received ${check.result}.`);
              }
            }
          ' "$PROMOTION_VALIDATION_REPORT" "$PROMOTION_MANIFEST"

      - name: Execute real pilot shadow
        run: npm --silent run promotion:shadow -- --manifest "$PROMOTION_MANIFEST" --run-id "$PROMOTION_RUN_ID" --json > "$PROMOTION_FRESH_RECEIPT"

      - name: Replay real pilot shadow with a distinct run identity
        run: npm --silent run promotion:shadow -- --manifest "$PROMOTION_MANIFEST" --run-id "$PROMOTION_REPLAY_RUN_ID" --json > "$PROMOTION_REPLAY_RECEIPT"

      - name: Compare fresh, replay, and canonical semantic receipt digests
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const paths = process.argv.slice(1);
            if (paths.length !== 3) throw new Error(`Expected three receipt paths, received ${paths.length}.`);
            const receipts = paths.map((receiptPath) => JSON.parse(readFileSync(receiptPath, "utf8")));
            const digests = receipts.map((receipt, index) => {
              const digest = receipt.semanticReceiptDigest;
              if (typeof digest !== "string" || !/^[a-f0-9]{64}$/.test(digest)) {
                throw new Error(`Receipt ${paths[index]} has no valid semanticReceiptDigest.`);
              }
              return digest;
            });
            if (!digests.every((digest) => digest === digests[0])) {
              throw new Error(`Semantic receipt digest mismatch: ${digests.join(", ")}`);
            }
          ' "$PROMOTION_FRESH_RECEIPT" "$PROMOTION_REPLAY_RECEIPT" "$PROMOTION_CANONICAL_RECEIPT"

      - name: Verify fresh receipt
        if: ${{ always() }}
        run: npm --silent run promotion:verify-receipt -- --receipt "$PROMOTION_FRESH_RECEIPT" --json > "$PROMOTION_FRESH_VERIFICATION_REPORT"

      - name: Verify replayed receipt
        if: ${{ always() }}
        run: npm --silent run promotion:verify-receipt -- --receipt "$PROMOTION_REPLAY_RECEIPT" --json > "$PROMOTION_REPLAY_VERIFICATION_REPORT"

      - name: Verify canonical receipt
        if: ${{ always() }}
        run: npm --silent run promotion:verify-receipt -- --receipt "$PROMOTION_CANONICAL_RECEIPT" --json > "$PROMOTION_CANONICAL_VERIFICATION_REPORT"

      - name: Assert receipt verification envelopes
        if: ${{ always() }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const paths = process.argv.slice(1);
            if (paths.length !== 6) throw new Error(`Expected three receipt/report pairs, received ${paths.length / 2}.`);
            const assertExactKeys = (value, expectedKeys, label) => {
              if (!value || typeof value !== "object" || Array.isArray(value)) {
                throw new Error(`${label} must be an object.`);
              }
              const actualKeys = Object.keys(value).sort();
              const sortedExpectedKeys = [...expectedKeys].sort();
              if (JSON.stringify(actualKeys) !== JSON.stringify(sortedExpectedKeys)) {
                throw new Error(`${label} fields must be exactly ${sortedExpectedKeys.join(", ")}.`);
              }
            };
            for (let index = 0; index < paths.length; index += 2) {
              const receiptPath = paths[index];
              const reportPath = paths[index + 1];
              const receipt = JSON.parse(readFileSync(receiptPath, "utf8"));
              const report = JSON.parse(readFileSync(reportPath, "utf8"));
              const label = `verification report ${reportPath}`;
              assertExactKeys(
                report,
                [
                  "schemaVersion",
                  "result",
                  "manifestPath",
                  "manifestDigest",
                  "semanticReceiptDigest",
                  "rawReceiptDigest"
                ],
                label
              );
              if (report.schemaVersion !== "promotion-receipt-verification.v1") {
                throw new Error(`${label} has unexpected schema ${report.schemaVersion}.`);
              }
              if (report.result !== "pass") {
                throw new Error(`${label} result must be pass, received ${report.result}.`);
              }
              if (!receipt.manifest || typeof receipt.manifest.path !== "string") {
                throw new Error(`Receipt ${receiptPath} has no manifest path.`);
              }
              const expected = {
                manifestPath: receipt.manifest.path,
                manifestDigest: receipt.manifest.rawSha256,
                semanticReceiptDigest: receipt.semanticReceiptDigest,
                rawReceiptDigest: receipt.rawReceiptDigest
              };
              for (const [field, expectedValue] of Object.entries(expected)) {
                if (report[field] !== expectedValue) {
                  throw new Error(`${label} ${field} does not match receipt ${receiptPath}.`);
                }
              }
              for (const digestName of ["manifestDigest", "semanticReceiptDigest", "rawReceiptDigest"]) {
                if (!/^[a-f0-9]{64}$/.test(report[digestName])) {
                  throw new Error(`${label} ${digestName} must be a lowercase SHA-256 digest.`);
                }
              }
            }
          ' \
            "$PROMOTION_FRESH_RECEIPT" "$PROMOTION_FRESH_VERIFICATION_REPORT" \
            "$PROMOTION_REPLAY_RECEIPT" "$PROMOTION_REPLAY_VERIFICATION_REPORT" \
            "$PROMOTION_CANONICAL_RECEIPT" "$PROMOTION_CANONICAL_VERIFICATION_REPORT"

      - name: Upload Promotion Shadow gate artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: promotion-shadow-gate-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/promotion-validation-report.v1.json
            ${{ runner.temp }}/promotion-shadow-receipt.v1.json
            ${{ runner.temp }}/promotion-shadow-replay-receipt.v1.json
            ${{ runner.temp }}/promotion-fresh-receipt-verification.v1.json
            ${{ runner.temp }}/promotion-replay-receipt-verification.v1.json
            ${{ runner.temp }}/promotion-canonical-receipt-verification.v1.json
          if-no-files-found: error
          retention-days: 14
