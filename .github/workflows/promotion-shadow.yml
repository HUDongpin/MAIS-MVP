      - name: Upload PR201 candidate and historical evidence
        if: ${{ always() && steps.contract.outputs.mode == 'candidate-pr201' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-pr201-candidate-evidence
          path: |
            ${{ runner.temp }}/promotion-pr201-candidate-artifacts
            ${{ runner.temp }}/promotion-pr201-candidate-baseline-artifacts
