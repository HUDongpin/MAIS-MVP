      - name: Upload PR264 reviewed-code and historical baseline evidence
        if: ${{ always() && steps.contract.outputs.mode == 'reviewed-code-pr264' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-reviewed-code-pr264-v1-evidence
          path: |
            ${{ runner.temp }}/promotion-reviewed-code-pr264-artifacts
            ${{ runner.temp }}/promotion-reviewed-code-pr264-baseline-artifacts
