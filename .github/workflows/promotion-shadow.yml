name: promotion-shadow-gate

on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  promotion-shadow-gate:
    name: promotion-shadow-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GIT_CONFIG_COUNT: "4"
      GIT_CONFIG_KEY_0: gc.auto
      GIT_CONFIG_VALUE_0: "0"
      GIT_CONFIG_KEY_1: gc.autoDetach
      GIT_CONFIG_VALUE_1: "false"
      GIT_CONFIG_KEY_2: maintenance.auto
      GIT_CONFIG_VALUE_2: "false"
      GIT_CONFIG_KEY_3: maintenance.autoDetach
      GIT_CONFIG_VALUE_3: "false"
      PROMOTION_MANIFEST: coordination/integration/pilots/us-ca-math-rag-v2-g6-ratios-v2/attempt-007/reaffirmations/auth-private-no-store-20260827/reaffirmations/k-g5-cot-leak-20260827/reaffirmations/app-storage-schema-20260827/reaffirmations/runtime-loader-policy-20260827/reaffirmations/legacy-readiness-marker-20260827/reaffirmations/runtime-loader-policy-20260827/reaffirmations/legacy-compat-readiness-v2-20260827/reaffirmations/runtime-loader-policy-v2-20260827/reaffirmations/parent-instance-proof-inline-20260827/reaffirmations/production-schema-diagnostic-20260827/reaffirmations/reviewed-main-runtime-graph-20260827/reaffirmations/production-schema-diagnostic-v2-tooling-20260827/reaffirmations/c0-i18n-content-legacy-byte-review-20260828/reaffirmations/session-privacy-ux-20260828/reaffirmations/pr220-strict-json-composition-20260830/reaffirmations/runtime-policy-exact-delta-20260901/promotion-manifest.v2.json
      PROMOTION_CANONICAL_RECEIPT: coordination/integration/pilots/us-ca-math-rag-v2-g6-ratios-v2/attempt-007/reaffirmations/auth-private-no-store-20260827/reaffirmations/k-g5-cot-leak-20260827/reaffirmations/app-storage-schema-20260827/reaffirmations/runtime-loader-policy-20260827/reaffirmations/legacy-readiness-marker-20260827/reaffirmations/runtime-loader-policy-20260827/reaffirmations/legacy-compat-readiness-v2-20260827/reaffirmations/runtime-loader-policy-v2-20260827/reaffirmations/parent-instance-proof-inline-20260827/reaffirmations/production-schema-diagnostic-20260827/reaffirmations/reviewed-main-runtime-graph-20260827/reaffirmations/production-schema-diagnostic-v2-tooling-20260827/reaffirmations/c0-i18n-content-legacy-byte-review-20260828/reaffirmations/session-privacy-ux-20260828/reaffirmations/pr220-strict-json-composition-20260830/reaffirmations/runtime-policy-exact-delta-20260901/promotion-shadow-receipt.v2.json
      PROMOTION_CANONICAL_RECEIPT_ABSOLUTE: ${{ github.workspace }}/coordination/integration/pilots/us-ca-math-rag-v2-g6-ratios-v2/attempt-007/reaffirmations/auth-private-no-store-20260827/reaffirmations/k-g5-cot-leak-20260827/reaffirmations/app-storage-schema-20260827/reaffirmations/runtime-loader-policy-20260827/reaffirmations/legacy-readiness-marker-20260827/reaffirmations/runtime-loader-policy-20260827/reaffirmations/legacy-compat-readiness-v2-20260827/reaffirmations/runtime-loader-policy-v2-20260827/reaffirmations/parent-instance-proof-inline-20260827/reaffirmations/production-schema-diagnostic-20260827/reaffirmations/reviewed-main-runtime-graph-20260827/reaffirmations/production-schema-diagnostic-v2-tooling-20260827/reaffirmations/c0-i18n-content-legacy-byte-review-20260828/reaffirmations/session-privacy-ux-20260828/reaffirmations/pr220-strict-json-composition-20260830/reaffirmations/runtime-policy-exact-delta-20260901/promotion-shadow-receipt.v2.json
      PROMOTION_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      PROMOTION_REAFFIRMATION: coordination/integration/pilots/us-ca-math-rag-v2-g6-ratios-v2/attempt-007/reaffirmations/auth-private-no-store-20260827/reaffirmations/k-g5-cot-leak-20260827/reaffirmations/app-storage-schema-20260827/reaffirmations/runtime-loader-policy-20260827/reaffirmations/legacy-readiness-marker-20260827/reaffirmations/runtime-loader-policy-20260827/reaffirmations/legacy-compat-readiness-v2-20260827/reaffirmations/runtime-loader-policy-v2-20260827/reaffirmations/parent-instance-proof-inline-20260827/reaffirmations/production-schema-diagnostic-20260827/reaffirmations/reviewed-main-runtime-graph-20260827/reaffirmations/production-schema-diagnostic-v2-tooling-20260827/reaffirmations/c0-i18n-content-legacy-byte-review-20260828/reaffirmations/session-privacy-ux-20260828/reaffirmations/pr220-strict-json-composition-20260830/reaffirmations/runtime-policy-exact-delta-20260901/reaffirmation.v2.json
      PROMOTION_REPLAY_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-replay
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install current dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Validate Promotion Shadow finalization contract
        run: npm run test:promotion-gate

      - name: Configure isolated Promotion Shadow paths
        run: |
          set -euo pipefail
          umask 077
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          runner_temp="${RUNNER_TEMP%/}"
          if [[ "$runner_temp" != /* || "$runner_temp" == "/" || "$runner_temp" == *$'\n'* ]]; then
            echo "RUNNER_TEMP must be a non-root absolute path without newlines." >&2
            exit 1
          fi
          artifact_root="$runner_temp/promotion-shadow-gate-v2-artifacts"
          canonical_copy="$runner_temp/promotion-canonical-receipt.v2.json"
          execution_worktree="$runner_temp/promotion-shadow-v2-execution"
          for target in "$artifact_root" "$canonical_copy" "$execution_worktree"; do
            if [[ -e "$target" || -L "$target" ]]; then
              echo "Promotion Shadow isolated target already exists: $target" >&2
              exit 1
            fi
          done
          install -d -m 0700 "$artifact_root"
          {
            printf 'PROMOTION_ARTIFACT_ROOT=%s\n' "$artifact_root"
            printf 'PROMOTION_CANONICAL_RECEIPT_COPY=%s\n' "$canonical_copy"
            printf 'PROMOTION_EXECUTION_WORKTREE=%s\n' "$execution_worktree"
            printf 'PROMOTION_CURRENT_VALIDATION=%s\n' "$artifact_root/promotion-current-validation.v2.json"
            printf 'PROMOTION_FRESH_RECEIPT=%s\n' "$artifact_root/promotion-shadow-receipt.v2.json"
            printf 'PROMOTION_REPLAY_RECEIPT=%s\n' "$artifact_root/promotion-shadow-replay-receipt.v2.json"
            printf 'PROMOTION_FRESH_VERIFICATION=%s\n' "$artifact_root/promotion-fresh-verification.v2.json"
            printf 'PROMOTION_REPLAY_VERIFICATION=%s\n' "$artifact_root/promotion-replay-verification.v2.json"
            printf 'PROMOTION_CANONICAL_VERIFICATION=%s\n' "$artifact_root/promotion-canonical-verification.v2.json"
            printf 'PROMOTION_REQUIRED_CHECK_DECISION=%s\n' "$artifact_root/promotion-required-check-decision.v1.json"
          } >> "$GITHUB_ENV"

      - name: Validate current Promotion inputs and runtime graph
        if: ${{ always() }}
        run: |
          set -euo pipefail
          umask 077
          set +e
          npm --silent run promotion:validate -- --manifest "$PROMOTION_MANIFEST" --json > "$PROMOTION_CURRENT_VALIDATION"
          cli_exit=$?
          set -e
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import path from "node:path";
            import { pathToFileURL } from "node:url";
            const [reportPath, cliExitText] = process.argv.slice(1);
            const currentWorkspace = process.env.GITHUB_WORKSPACE;
            if (typeof currentWorkspace !== "string" || !path.isAbsolute(currentWorkspace)) {
              throw new Error("GITHUB_WORKSPACE must identify the current checkout.");
            }
            const guardPath = path.join(currentWorkspace, "scripts", "promotion-workflow-json-guard.mjs");
            const { parsePromotionWorkflowJsonBytes } = await import(pathToFileURL(guardPath).href);
            const report = parsePromotionWorkflowJsonBytes(readFileSync(reportPath));
            const expectedExit = { pass: 0, fail: 1, blocked: 2, internal: 3 }[report.result];
            const cliExit = Number(cliExitText);
            if (expectedExit === undefined || cliExit !== expectedExit) {
              throw new Error(`Validation CLI exit ${cliExit} does not match result ${String(report.result)}.`);
            }
            if (report.result === "pass" && (
              report.schemaVersion !== "promotion-validation-result.v2" ||
              report.liveAllowed !== false ||
              report.pilotUnitStatus !== "shadow_ready"
            )) {
              throw new Error("Passing current validation has an invalid v2 non-live envelope.");
            }
          ' "$PROMOTION_CURRENT_VALIDATION" "$cli_exit"

      - name: Resolve committed canonical Receipt execution commit
        id: resolve-promotion-execution
        if: ${{ always() }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { closeSync, lstatSync, openSync, readFileSync, realpathSync, writeFileSync } from "node:fs";
            import path from "node:path";
            import { pathToFileURL } from "node:url";
            const [receiptPath, receiptRelativePath, manifestPath, copyPath, runnerTemp, outputPath] = process.argv.slice(1);
            const assertSafeRepoPath = (value, label) => {
              if (!value || path.posix.isAbsolute(value) || path.posix.normalize(value) !== value || value.startsWith("../") || value.includes("\\") || value.includes("\u0000")) {
                throw new Error(`${label} must be a canonical POSIX repository-relative path.`);
              }
            };
            const lstatOrNull = (target) => {
              try { return lstatSync(target); } catch (error) { if (error?.code === "ENOENT") return null; throw error; }
            };
            const maxInputBytes = 32 * 1024 * 1024;
            const assertBoundedRegularFile = (entry, expectedPath, label) => {
              if (!entry?.isFile() || entry.isSymbolicLink() || entry.size > maxInputBytes || realpathSync(expectedPath) !== expectedPath) throw new Error(`${label} must be one bounded canonical regular file.`);
            };
            const exactKeys = (value, keys, label) => {
              if (value === null || typeof value !== "object" || Array.isArray(value) || Object.keys(value).sort().join("\u0000") !== [...keys].sort().join("\u0000")) {
                throw new Error(`${label} has an invalid closed key set.`);
              }
            };
            const isHex = (value, length) => typeof value === "string" && new RegExp(`^[a-f0-9]{${length}}$`).test(value);
            const rejectSelfAuthority = (value) => {
              if (value === null || typeof value !== "object") return;
              for (const [key, child] of Object.entries(value)) {
                const normalized = key.replace(/[^a-z0-9]/giu, "").toLowerCase();
                if (["executioncommit", "storagecommit", "finalizationcommit", "canonicalreceipthash", "canonicalreceiptdigest", "canonicalreceiptrawsha256", "canonicalreceiptsha256"].includes(normalized)) {
                  throw new Error("Reaffirmation descriptor must not self-authorize canonical Receipt execution or storage.");
                }
                rejectSelfAuthority(child);
              }
            };
            const gitBlobId = async (bytes) => {
              if (!globalThis.crypto?.subtle) throw new Error("Web Crypto is required to bind Git blob identities.");
              const header = new TextEncoder().encode(`blob ${bytes.length}\u0000`);
              const payload = new Uint8Array(header.length + bytes.length);
              payload.set(header);
              payload.set(bytes, header.length);
              return [...new Uint8Array(await globalThis.crypto.subtle.digest("SHA-1", payload))].map((byte) => byte.toString(16).padStart(2, "0")).join("");
            };
            const sha256Bytes = async (bytes) => {
              if (!globalThis.crypto?.subtle) throw new Error("Web Crypto is required to bind Manifest bytes.");
              return [...new Uint8Array(await globalThis.crypto.subtle.digest("SHA-256", bytes))].map((byte) => byte.toString(16).padStart(2, "0")).join("");
            };
            assertSafeRepoPath(receiptRelativePath, "Canonical Receipt path");
            assertSafeRepoPath(manifestPath, "Manifest path");
            const descriptorPath = path.posix.join(path.posix.dirname(manifestPath), "reaffirmation.v2.json");
            assertSafeRepoPath(descriptorPath, "Reaffirmation descriptor path");
            for (const [value, label] of [[receiptPath, "Receipt"], [copyPath, "Receipt copy"], [runnerTemp, "Runner temp"], [outputPath, "GitHub output"]]) {
              if (!path.isAbsolute(value)) throw new Error(`${label} path must be absolute.`);
            }
            const repoRoot = realpathSync(process.cwd());
            const expectedReceipt = path.resolve(repoRoot, receiptRelativePath);
            if (receiptPath !== expectedReceipt) throw new Error("Canonical Receipt path must be its exact repository location.");
            const expectedManifest = path.resolve(repoRoot, manifestPath);
            const expectedDescriptor = path.resolve(repoRoot, descriptorPath);
            const manifestEntry = lstatOrNull(expectedManifest);
            const descriptorEntry = lstatOrNull(expectedDescriptor);
            assertBoundedRegularFile(manifestEntry, expectedManifest, "Manifest");
            assertBoundedRegularFile(descriptorEntry, expectedDescriptor, "Reaffirmation descriptor");
            const currentWorkspace = process.env.GITHUB_WORKSPACE;
            if (typeof currentWorkspace !== "string" || !path.isAbsolute(currentWorkspace)) {
              throw new Error("GITHUB_WORKSPACE must identify the current checkout.");
            }
            const exactWorkspace = realpathSync(currentWorkspace);
            if (exactWorkspace !== repoRoot) throw new Error("GITHUB_WORKSPACE must be the exact checked-out repository.");
            const guardPath = path.join(exactWorkspace, "scripts", "promotion-workflow-json-guard.mjs");
            const { parsePromotionWorkflowJsonBytes } = await import(pathToFileURL(guardPath).href);
            const manifestBytes = readFileSync(expectedManifest);
            const descriptorBytes = readFileSync(expectedDescriptor);
            if (manifestBytes.byteLength > maxInputBytes || descriptorBytes.byteLength > maxInputBytes) throw new Error("Manifest and Reaffirmation descriptor exceed the fixed input limit.");
            const reaffirmation = parsePromotionWorkflowJsonBytes(descriptorBytes);
            const manifestRawSha256 = await sha256Bytes(manifestBytes);
            exactKeys(reaffirmation, ["schemaVersion", "relation", "directParent", "historicalBase", "revision", "unchangedBindings", "baselineDelta", "ordering"], "Reaffirmation descriptor");
            if (reaffirmation.schemaVersion !== "promotion-reaffirmation.v2" || reaffirmation.relation !== "append-only-reaffirmation") throw new Error("Reaffirmation descriptor is not v2 append-only authority.");
            exactKeys(reaffirmation.revision, ["manifest"], "Reaffirmation revision");
            exactKeys(reaffirmation.revision.manifest, ["path", "rawSha256"], "Reaffirmation revision Manifest");
            if (reaffirmation.revision.manifest.path !== manifestPath || reaffirmation.revision.manifest.rawSha256 !== manifestRawSha256) {
              throw new Error("Reaffirmation descriptor Manifest revision does not bind the current Manifest bytes.");
            }
            exactKeys(reaffirmation.ordering, ["evidenceCommit"], "Reaffirmation ordering");
            if (!isHex(reaffirmation.ordering.evidenceCommit, 40)) throw new Error("Reaffirmation descriptor evidence commit is invalid.");
            rejectSelfAuthority(reaffirmation);
            if (lstatOrNull(path.join(repoRoot, ".git", "shallow"))) throw new Error("Shallow repositories cannot prove canonical Promotion history.");
            const evidenceCommit = reaffirmation.ordering.evidenceCommit;
            const rawHistory = execFileSync("git", ["show", "--format=%H%x00%P%x00", "--raw", "-z", "--no-abbrev", "--no-renames", `${evidenceCommit}..HEAD`], { cwd: repoRoot, encoding: null, maxBuffer: 32 * 1024 * 1024 });
            const historyText = new TextDecoder("utf-8", { fatal: true }).decode(rawHistory);
            const tokens = historyText.split("\u0000");
            const commits = new Map();
            const changes = [];
            let currentCommit = null;
            for (let index = 0; index < tokens.length; index += 1) {
              const token = tokens[index].startsWith("\n") ? tokens[index].slice(1) : tokens[index];
              if (token === "") continue;
              if (isHex(token, 40)) {
                const parentText = tokens[++index] ?? "";
                const parents = parentText === "" ? [] : parentText.split(" ");
                if (parents.some((parent) => !isHex(parent, 40)) || commits.has(token)) throw new Error("Promotion history commit graph is malformed.");
                commits.set(token, parents);
                currentCommit = token;
                continue;
              }
              const raw = token.match(/^:([0-7]{6}) ([0-7]{6}) ([a-f0-9]{40}) ([a-f0-9]{40}) ([ADM])$/u);
              if (!raw || currentCommit === null) throw new Error("Promotion history must be NUL-safe raw Git diffs without rename records.");
              const changedPath = tokens[++index];
              if (typeof changedPath !== "string" || changedPath.includes("\u0000")) throw new Error("Promotion history path record is malformed.");
              if ([manifestPath, descriptorPath, receiptRelativePath].includes(changedPath)) changes.push({ commit: currentCommit, status: raw[5], oldBlob: raw[3], newBlob: raw[4], path: changedPath });
            }
            const manifestBlob = await gitBlobId(manifestBytes);
            const descriptorBlob = await gitBlobId(descriptorBytes);
            const bindingChanges = changes.filter((change) => change.path === manifestPath || change.path === descriptorPath);
            if (bindingChanges.length !== 2 || bindingChanges.some((change) => change.status !== "A")) throw new Error("Manifest and Reaffirmation descriptor must have one atomic add-only binding.");
            const bindingCommit = bindingChanges[0].commit;
            if (bindingChanges.some((change) => change.commit !== bindingCommit) || !commits.has(bindingCommit) || commits.get(bindingCommit).length !== 1 || commits.get(bindingCommit)[0] !== evidenceCommit || bindingChanges.find((change) => change.path === manifestPath).newBlob !== manifestBlob || bindingChanges.find((change) => change.path === descriptorPath).newBlob !== descriptorBlob) {
              throw new Error("Canonical Manifest binding must be exactly one direct evidence descendant with exact Git blobs.");
            }
            const heads = [...commits.keys()].filter((commit) => ![...commits.values()].some((parents) => parents.includes(commit)));
            if (heads.length !== 1) throw new Error("Promotion history must have one reachable current HEAD in the evidence range.");
            const reachable = new Set();
            const visit = (commit) => { if (reachable.has(commit)) return; reachable.add(commit); for (const parent of commits.get(commit) ?? []) if (commits.has(parent)) visit(parent); };
            visit(heads[0]);
            if (!reachable.has(bindingCommit)) throw new Error("Canonical execution binding is not reachable from current HEAD.");
            const isStrictAncestor = (ancestor, descendant) => {
              const seen = new Set();
              const walk = (commit) => {
                if (seen.has(commit)) return false;
                seen.add(commit);
                for (const parent of commits.get(commit) ?? []) {
                  if (parent === ancestor || walk(parent)) return true;
                }
                return false;
              };
              return ancestor !== descendant && walk(descendant);
            };
            const receiptChanges = changes.filter((change) => change.path === receiptRelativePath);
            const expectedCopy = path.join(realpathSync(runnerTemp), "promotion-canonical-receipt.v2.json");
            if (copyPath !== expectedCopy) throw new Error("Canonical copy path is not the fixed runner-temp path.");
            const receiptEntry = lstatOrNull(expectedReceipt);
            let executionCommit = bindingCommit;
            if (receiptEntry === null) {
              if (receiptChanges.length !== 0) throw new Error("Absent canonical Receipt cannot have historical add, mutation, deletion, or re-add records.");
            } else {
              assertBoundedRegularFile(receiptEntry, expectedReceipt, "Canonical Receipt");
              if (receiptPath !== expectedReceipt || receiptChanges.length !== 1 || receiptChanges[0].status !== "A" || !reachable.has(receiptChanges[0].commit) || !isStrictAncestor(bindingCommit, receiptChanges[0].commit)) throw new Error("Canonical Receipt must be one exact strict-descendant add-only record.");
              const workingBytes = readFileSync(receiptPath);
              if (workingBytes.byteLength > maxInputBytes) throw new Error("Canonical Receipt exceeds the fixed input limit.");
              if (await gitBlobId(workingBytes) !== receiptChanges[0].newBlob) throw new Error("Canonical Receipt bytes must equal the committed Git blob.");
              const committedBytes = workingBytes;
              if (!workingBytes.equals(committedBytes)) throw new Error("Canonical Receipt bytes must equal the current committed Git object.");
              const receipt = parsePromotionWorkflowJsonBytes(workingBytes);
              if (receipt.schemaVersion !== "promotion-receipt.v2" || receipt.result !== "pass" || receipt.manifest?.path !== manifestPath || receipt.manifest?.rawSha256 !== manifestRawSha256 || receipt.binding?.liveAllowed !== false || receipt.lifecycle?.liveAllowed !== false || receipt.worktreeProof?.executionCommit !== bindingCommit) throw new Error("Canonical Receipt must be a passing, non-live v2 Receipt for the exact bound Manifest execution.");
              executionCommit = bindingCommit;
              let descriptor;
              try {
                descriptor = openSync(copyPath, "wx", 0o600);
                writeFileSync(descriptor, workingBytes);
              } finally {
                if (descriptor !== undefined) closeSync(descriptor);
              }
              const copyEntry = lstatSync(copyPath);
              if (!copyEntry.isFile() || copyEntry.isSymbolicLink() || copyEntry.nlink !== 1 || (copyEntry.mode & 0o777) !== 0o600 || realpathSync(copyPath) !== copyPath) throw new Error("Canonical Receipt copy must be one exact 0600 regular file.");
            }
            writeFileSync(outputPath, `execution_commit=${executionCommit}\n`, { flag: "a" });
          ' \
            "$PROMOTION_CANONICAL_RECEIPT_ABSOLUTE" \
            "$PROMOTION_CANONICAL_RECEIPT" \
            "$PROMOTION_MANIFEST" \
            "$PROMOTION_CANONICAL_RECEIPT_COPY" \
            "$RUNNER_TEMP" \
            "$GITHUB_OUTPUT"

      - name: Prepare detached canonical execution worktree
        if: ${{ always() }}
        env:
          PROMOTION_EXECUTION_COMMIT: ${{ steps.resolve-promotion-execution.outputs.execution_commit }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          : "${PROMOTION_EXECUTION_COMMIT:?Canonical execution commit is required}"
          if [[ ! "$PROMOTION_EXECUTION_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Canonical execution commit must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          expected_worktree="${RUNNER_TEMP%/}/promotion-shadow-v2-execution"
          if [[ "$PROMOTION_EXECUTION_WORKTREE" != "$expected_worktree" || -e "$PROMOTION_EXECUTION_WORKTREE" || -L "$PROMOTION_EXECUTION_WORKTREE" ]]; then
            echo "Canonical execution worktree target is unsafe or already exists." >&2
            exit 1
          fi
          git cat-file -e "${PROMOTION_EXECUTION_COMMIT}^{commit}"
          git merge-base --is-ancestor "$PROMOTION_EXECUTION_COMMIT" HEAD
          git worktree add --detach "$PROMOTION_EXECUTION_WORKTREE" "$PROMOTION_EXECUTION_COMMIT"
          test "$(git -C "$PROMOTION_EXECUTION_WORKTREE" rev-parse HEAD)" = "$PROMOTION_EXECUTION_COMMIT"
          test -z "$(git -C "$PROMOTION_EXECUTION_WORKTREE" status --porcelain=v1 --untracked-files=all)"

      - name: Install canonical execution dependencies
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cd "$PROMOTION_EXECUTION_WORKTREE"
          npm ci --ignore-scripts

      - name: Execute canonical pilot shadow
        if: ${{ always() }}
        run: |
          set -euo pipefail
          umask 077
          cd "$PROMOTION_EXECUTION_WORKTREE"
          set +e
          npm --silent run promotion:shadow -- --manifest "$PROMOTION_MANIFEST" --run-id "$PROMOTION_RUN_ID" --json > "$PROMOTION_FRESH_RECEIPT"
          cli_exit=$?
          set -e
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import path from "node:path";
            import { pathToFileURL } from "node:url";
            const [receiptPath, runId, cliExitText] = process.argv.slice(1);
            const currentWorkspace = process.env.GITHUB_WORKSPACE;
            if (typeof currentWorkspace !== "string" || !path.isAbsolute(currentWorkspace)) {
              throw new Error("GITHUB_WORKSPACE must identify the current checkout.");
            }
            const guardPath = path.join(currentWorkspace, "scripts", "promotion-workflow-json-guard.mjs");
            const { parsePromotionWorkflowJsonBytes } = await import(pathToFileURL(guardPath).href);
            const receipt = parsePromotionWorkflowJsonBytes(readFileSync(receiptPath));
            const expectedExit = { pass: 0, fail: 1, blocked: 2, internal: 3 }[receipt.result];
            if (Number(cliExitText) !== expectedExit || receipt.schemaVersion !== "promotion-receipt.v2" || receipt.run?.runId !== runId) {
              throw new Error("Fresh v2 Receipt envelope or CLI exit is invalid.");
            }
          ' "$PROMOTION_FRESH_RECEIPT" "$PROMOTION_RUN_ID" "$cli_exit"

      - name: Replay canonical pilot with distinct run identity
        if: ${{ always() }}
        run: |
          set -euo pipefail
          umask 077
          cd "$PROMOTION_EXECUTION_WORKTREE"
          set +e
          npm --silent run promotion:shadow -- --manifest "$PROMOTION_MANIFEST" --run-id "$PROMOTION_REPLAY_RUN_ID" --json > "$PROMOTION_REPLAY_RECEIPT"
          cli_exit=$?
          set -e
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import path from "node:path";
            import { pathToFileURL } from "node:url";
            const [receiptPath, runId, cliExitText] = process.argv.slice(1);
            const currentWorkspace = process.env.GITHUB_WORKSPACE;
            if (typeof currentWorkspace !== "string" || !path.isAbsolute(currentWorkspace)) {
              throw new Error("GITHUB_WORKSPACE must identify the current checkout.");
            }
            const guardPath = path.join(currentWorkspace, "scripts", "promotion-workflow-json-guard.mjs");
            const { parsePromotionWorkflowJsonBytes } = await import(pathToFileURL(guardPath).href);
            const receipt = parsePromotionWorkflowJsonBytes(readFileSync(receiptPath));
            const expectedExit = { pass: 0, fail: 1, blocked: 2, internal: 3 }[receipt.result];
            if (Number(cliExitText) !== expectedExit || receipt.schemaVersion !== "promotion-receipt.v2" || receipt.run?.runId !== runId) {
              throw new Error("Replay v2 Receipt envelope or CLI exit is invalid.");
            }
          ' "$PROMOTION_REPLAY_RECEIPT" "$PROMOTION_REPLAY_RUN_ID" "$cli_exit"

      - name: Compare canonical semantic Receipt digests
        if: ${{ always() }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const paths = process.argv.slice(1);
            const receipts = paths.map((receiptPath) => JSON.parse(readFileSync(receiptPath, "utf8")));
            if (receipts.length !== 3 || receipts.some((receipt) => receipt.result !== "pass" || receipt.binding?.liveAllowed !== false)) {
              throw new Error("All three semantic comparison inputs must be passing non-live Receipts.");
            }
            const digests = receipts.map((receipt) => receipt.semanticReceiptDigest);
            if (digests.some((digest) => !/^[a-f0-9]{64}$/.test(digest)) || !digests.every((digest) => digest === digests[0])) {
              throw new Error(`Semantic Receipt digest mismatch: ${digests.join(", ")}`);
            }
          ' "$PROMOTION_FRESH_RECEIPT" "$PROMOTION_REPLAY_RECEIPT" "$PROMOTION_CANONICAL_RECEIPT_COPY"

      - name: Verify fresh replay and canonical Receipts
        if: ${{ always() }}
        run: |
          set -euo pipefail
          umask 077
          cd "$PROMOTION_EXECUTION_WORKTREE"
          verify_one() {
            local receipt_path="$1"
            local report_path="$2"
            set +e
            npm --silent run promotion:verify-receipt -- --receipt "$receipt_path" --json > "$report_path"
            local cli_exit=$?
            set -e
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import path from "node:path";
              import { pathToFileURL } from "node:url";
              const [reportPath, cliExitText] = process.argv.slice(1);
              const currentWorkspace = process.env.GITHUB_WORKSPACE;
              if (typeof currentWorkspace !== "string" || !path.isAbsolute(currentWorkspace)) {
                throw new Error("GITHUB_WORKSPACE must identify the current checkout.");
              }
              const guardPath = path.join(currentWorkspace, "scripts", "promotion-workflow-json-guard.mjs");
              const { parsePromotionWorkflowJsonBytes } = await import(pathToFileURL(guardPath).href);
              const report = parsePromotionWorkflowJsonBytes(readFileSync(reportPath));
              const expectedExit = { pass: 0, fail: 1, blocked: 2, internal: 3 }[report.result];
              if (
                Number(cliExitText) !== expectedExit ||
                report.schemaVersion !== "promotion-receipt-verification.v2" ||
                report.valid !== true ||
                report.liveAllowed !== false
              ) {
                throw new Error("Receipt verification report is not an exact passing v2 non-live envelope.");
              }
            ' "$report_path" "$cli_exit"
          }
          verify_one "$PROMOTION_FRESH_RECEIPT" "$PROMOTION_FRESH_VERIFICATION"
          verify_one "$PROMOTION_REPLAY_RECEIPT" "$PROMOTION_REPLAY_VERIFICATION"
          verify_one "$PROMOTION_CANONICAL_RECEIPT_COPY" "$PROMOTION_CANONICAL_VERIFICATION"

      - name: Evaluate current-head semantic required-check decision
        if: ${{ always() }}
        run: |
          set -euo pipefail
          node "scripts/promotion-required-check-semantic-rescope-cli.mjs" evaluate \
            --repo "$GITHUB_WORKSPACE" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --manifest "$PROMOTION_MANIFEST" \
            --canonical-receipt-path "$PROMOTION_CANONICAL_RECEIPT" \
            --current-validation "$PROMOTION_CURRENT_VALIDATION" \
            --fresh-receipt "$PROMOTION_FRESH_RECEIPT" \
            --replay-receipt "$PROMOTION_REPLAY_RECEIPT" \
            --canonical-receipt-copy "$PROMOTION_CANONICAL_RECEIPT_COPY" \
            --fresh-verification "$PROMOTION_FRESH_VERIFICATION" \
            --replay-verification "$PROMOTION_REPLAY_VERIFICATION" \
            --canonical-verification "$PROMOTION_CANONICAL_VERIFICATION" \
            --decision "$PROMOTION_REQUIRED_CHECK_DECISION" \
            --artifact-root "$PROMOTION_ARTIFACT_ROOT"

      - name: Assert exact Promotion Shadow artifact set
        id: assert-artifact-set
        if: ${{ always() }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { lstatSync, readFileSync, readdirSync, realpathSync } from "node:fs";
            import path from "node:path";
            import { pathToFileURL } from "node:url";
            const [artifactRoot, ...artifactPaths] = process.argv.slice(1);
            const currentWorkspace = process.env.GITHUB_WORKSPACE;
            if (typeof currentWorkspace !== "string" || !path.isAbsolute(currentWorkspace)) {
              throw new Error("GITHUB_WORKSPACE must identify the current checkout.");
            }
            const guardPath = path.join(currentWorkspace, "scripts", "promotion-workflow-json-guard.mjs");
            const { parsePromotionWorkflowJsonBytes } = await import(pathToFileURL(guardPath).href);
            if (!path.isAbsolute(artifactRoot) || realpathSync(artifactRoot) !== artifactRoot) throw new Error("Artifact root is unsafe.");
            const expected = [
              "promotion-current-validation.v2.json",
              "promotion-shadow-receipt.v2.json",
              "promotion-shadow-replay-receipt.v2.json",
              "promotion-fresh-verification.v2.json",
              "promotion-replay-verification.v2.json",
              "promotion-canonical-verification.v2.json",
              "promotion-required-check-decision.v1.json"
            ].sort();
            const supplied = artifactPaths.map((entry) => {
              if (!path.isAbsolute(entry) || path.dirname(entry) !== artifactRoot) throw new Error("Artifact path escapes its root.");
              return path.basename(entry);
            }).sort();
            if (JSON.stringify(supplied) !== JSON.stringify(expected) || JSON.stringify(readdirSync(artifactRoot).sort()) !== JSON.stringify(expected)) {
              throw new Error("Promotion artifact set is incomplete or contains unexpected files.");
            }
            for (const artifactPath of artifactPaths) {
              const entry = lstatSync(artifactPath);
              if (!entry.isFile() || entry.isSymbolicLink() || entry.nlink !== 1 || entry.size === 0 || realpathSync(artifactPath) !== artifactPath) {
                throw new Error(`Unsafe Promotion artifact: ${artifactPath}`);
              }
              parsePromotionWorkflowJsonBytes(readFileSync(artifactPath));
            }
          ' \
            "$PROMOTION_ARTIFACT_ROOT" \
            "$PROMOTION_CURRENT_VALIDATION" \
            "$PROMOTION_FRESH_RECEIPT" \
            "$PROMOTION_REPLAY_RECEIPT" \
            "$PROMOTION_FRESH_VERIFICATION" \
            "$PROMOTION_REPLAY_VERIFICATION" \
            "$PROMOTION_CANONICAL_VERIFICATION" \
            "$PROMOTION_REQUIRED_CHECK_DECISION"

      - name: Upload Promotion Shadow gate artifacts
        if: ${{ always() && steps.assert-artifact-set.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-shadow-gate-v2-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-shadow-gate-v2-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Promotion Shadow Gate outcome
        if: ${{ always() }}
        run: |
          set -euo pipefail
          node "scripts/promotion-required-check-semantic-rescope-cli.mjs" verify \
            --repo "$GITHUB_WORKSPACE" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --manifest "$PROMOTION_MANIFEST" \
            --canonical-receipt-path "$PROMOTION_CANONICAL_RECEIPT" \
            --current-validation "$PROMOTION_CURRENT_VALIDATION" \
            --fresh-receipt "$PROMOTION_FRESH_RECEIPT" \
            --replay-receipt "$PROMOTION_REPLAY_RECEIPT" \
            --canonical-receipt-copy "$PROMOTION_CANONICAL_RECEIPT_COPY" \
            --fresh-verification "$PROMOTION_FRESH_VERIFICATION" \
            --replay-verification "$PROMOTION_REPLAY_VERIFICATION" \
            --canonical-verification "$PROMOTION_CANONICAL_VERIFICATION" \
            --decision "$PROMOTION_REQUIRED_CHECK_DECISION" \
            --artifact-root "$PROMOTION_ARTIFACT_ROOT"
