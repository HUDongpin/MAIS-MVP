      - name: Upload PR282/PR281/PR280 reviewed-code and historical baseline evidence
        if: ${{ always() && steps.contract.outputs.mode == 'reviewed-code-pr282-pr281-pr280' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-reviewed-code-pr282-pr281-pr280-evidence
          path: |
            ${{ runner.temp }}/promotion-reviewed-code-pr282-pr281-pr280-artifacts
            ${{ runner.temp }}/promotion-reviewed-code-pr282-pr281-pr280-baseline-artifacts
          if-no-files-found: error

      - name: Upload PR283 E2 reviewed-code and historical baseline evidence
        if: ${{ always() && steps.contract.outputs.mode == 'reviewed-code-pr283-e2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-reviewed-code-pr283-e2-evidence
          path: |
            ${{ runner.temp }}/promotion-reviewed-code-pr283-e2-artifacts
            ${{ runner.temp }}/promotion-reviewed-code-pr283-e2-baseline-artifacts
          if-no-files-found: error

      - name: Upload PR287 and unchanged historical proof artifacts
        if: ${{ always() && steps.contract.outputs.mode == 'reviewed-code-pr287-v1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-pr287-v1-evidence
          path: |
            ${{ runner.temp }}/promotion-pr287-artifacts
            ${{ runner.temp }}/promotion-pr287-e2-artifacts
            ${{ runner.temp }}/promotion-pr287-baseline-artifacts
          if-no-files-found: error

      - name: Upload PR283 repair reviewed-code and historical baseline evidence
        if: ${{ always() && steps.contract.outputs.mode == 'reviewed-code-pr283-merge-assertion' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-reviewed-code-pr283-merge-assertion-evidence
          path: |
            ${{ runner.temp }}/promotion-reviewed-code-pr283-merge-assertion-artifacts
            ${{ runner.temp }}/promotion-reviewed-code-pr283-merge-assertion-baseline-artifacts
          if-no-files-found: error

      - name: Upload PR285 v2 current and both historical gate proofs
        if: ${{ always() && steps.contract.outputs.mode == 'reviewed-code-pr285-v2' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-pr285-v2-evidence
          path: |
            ${{ runner.temp }}/promotion-pr285-v2-artifacts
            ${{ runner.temp }}/promotion-pr285-v2-history/old-artifacts
            ${{ runner.temp }}/promotion-pr285-v2-history/main-artifacts
            ${{ runner.temp }}/promotion-pr285-v2-history/e2-artifacts
            ${{ runner.temp }}/promotion-pr285-v2-history/baseline-artifacts
          if-no-files-found: error
