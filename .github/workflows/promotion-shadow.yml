      - name: Upload PR276 v3 reviewed-code and historical baseline evidence
        if: ${{ always() && steps.contract.outputs.mode == 'reviewed-code-pr276-v3' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-reviewed-code-pr276-v3-evidence
          path: |
            ${{ runner.temp }}/promotion-reviewed-code-pr276-v3-artifacts
            ${{ runner.temp }}/promotion-reviewed-code-pr276-v3-baseline-artifacts
