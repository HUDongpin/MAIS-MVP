name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run type-check, focused tests, and production build
        required: false
        default: false
        type: boolean

# A PR branch fires `push` and `pull_request` as two independent runs, and each
# new push adds another pair. Now that `validate` gates pull requests that is
# ~19 runner-minutes per superseded commit, so retire the stale ones. `main`
# never cancels: its post-merge runs are the record that the merge was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

  validate:
    # Gates every pull request. Until now this was workflow_dispatch-only, so a
    # normal PR merged without ever running the type check, any gate suite, or
    # the production build — only `snapshot` (an npm install) and the two
    # Playwright jobs were required, which is how a broken change reached main.
    # Steps are ordered cheapest-first so a bad PR fails in ~90s instead of
    # ~15min: everything before "MVP readiness" finishes in seconds.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full_validation) }}
    runs-on: ubuntu-latest
    # A non-incremental `tsc --noEmit` (and the production build) over this repo
    # exceeds Node's default ~2 GB old-space and OOMs the runner; runners have
    # 16 GB, so give the whole job a larger heap.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Run import-target guard and its unit test
        run: npm run check:imports && npm run test:imports

      - name: Run stray generated-types guard and its unit test
        run: npm run check:stray-types && npm run test:stray-types

      # The governance gate diffs the merged package.json against a frozen
      # baseline commit, which a depth-1 checkout does not contain. Fetch only
      # that commit — a full-history checkout would pull gigabytes of assets.
      - name: Fetch the frozen release-governance baseline commit
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin ce2ae5258013ca5bd79dd0cc56e7b1681d5cd411
          git cat-file -e ce2ae5258013ca5bd79dd0cc56e7b1681d5cd411:package.json

      - name: Run release governance gate (frozen package-script baseline + release command contracts)
        run: npm run test:release-governance

      - name: Run analytics tests
        run: npm run test:analytics

      - name: Run AI Tutor transcript visibility gate (access audit log + teacher access boundary)
        run: npm run test:tutor-transcript

      - name: Run AI Tutor content-moderation gate (input block + output withhold)
        run: npm run test:tutor-moderation

      - name: Run AI Tutor content-safety gate (crisis classifier + teacher escalation)
        run: npm run test:content-safety

      - name: Run lesson menu focus gate (keyboard focus survives the SSR duplicate)
        run: npm run test:lesson-menu

      - name: Run accommodations gate (IEP/504 resolver + student-experience wiring)
        run: npm run test:accommodations

      - name: Run US math item quality audit (CA/AR/FL independent re-solve + key integrity)
        run: npm run audit:us-math-items

      - name: Run lesson-illustration asset integrity gate (live manifests must not reference missing assets)
        run: npm run audit:lesson-illustrations

      - name: Run reported-bug source-regression gate (fix anchors + segment loading.tsx ban)
        run: npm run test:source-regressions

      - name: Run CCSS depth-coverage gate (a student can reach a visual per standard)
        run: npm run test:ccss-depth

      - name: Run MVP readiness tests
        run: npm run test:mvp

      - name: Run signature lab gates (math audits + assignment contract)
        run: npm run test:signature-labs

      - name: Run CCSS textbook gates (class audit + assignment contract)
        run: npm run test:ccss-textbook

      - name: Run visualization gate
        run: npm run test:visualizations

      - name: Run component gate (discovers every components/**/*.test.ts)
        run: npm run test:components

      # Slowest gate in the job (~5min): keep it last so every cheaper gate has
      # already had its chance to fail.
      - name: Run question bank contract tests (per-region live counts + solvability)
        run: npm run test:question-bank

      - name: Build
        run: npm run build

  visualization-browser:
    # Browser half of the visualization QA gate (transfer-doc F4 / Q1 -> Playwright).
    # Runs on every PR (first green run 2026-07-21) plus manual full_validation.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full_validation) }}
    runs-on: ubuntu-latest
    # Playwright's webServer builds the app; that Next build OOMs Node's default
    # ~2 GB old-space on the runner. Match the `validate` job's larger heap.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visualization DOM-contract spec
        run: npx playwright test tests/e2e/visualization-contract.spec.ts --project=desktop-chrome

  teacher-parent-e2e:
    # Teacher + parent journey E2E in CI (plan P2-3). Runs on every PR (first
    # green run 2026-07-21) plus manual full_validation dispatch.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full_validation) }}
    runs-on: ubuntu-latest
    # Playwright's webServer builds the app; that Next build OOMs Node's default
    # ~2 GB old-space on the runner. Match the `validate` job's larger heap.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run teacher + parent journeys
        run: npx playwright test tests/e2e/teacher-operations.spec.ts tests/e2e/teacher-workspace.spec.ts tests/e2e/parent-console.spec.ts --project=desktop-chrome

      # Playwright retains a trace, screenshot, and video for each failed test
      # under the per-run root `.tmp/e2e-run-<id>/` (see playwright.config.ts:
      # `outputDir`/`trace: retain-on-failure`). Those only ever existed on the
      # runner, so a red e2e job could not be diagnosed after the fact — the
      # log names a trace.zip path that is already gone. Upload them instead.
      # Deliberately narrow: the same run root also holds `next-dist`, a full
      # multi-hundred-MB Next build that must not be uploaded.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-parent-e2e-failure-artifacts
          path: |
            .tmp/e2e-run-*/test-results
            .tmp/e2e-run-*/playwright-report
          retention-days: 7
          if-no-files-found: warn
