name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run type-check, focused tests, and production build
        required: false
        default: false
        type: boolean

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Run analytics tests
        run: npm run test:analytics

      - name: Run MVP readiness tests
        run: npm run test:mvp

      - name: Run visualization gate
        run: npm run test:visualizations

      - name: Build
        run: npm run build

  visualization-browser:
    # Browser half of the visualization QA gate (transfer-doc F4 / Q1 -> Playwright).
    # Kept on workflow_dispatch until its first green run, then promote to PR if desired.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visualization DOM-contract spec
        run: npx playwright test tests/e2e/visualization-contract.spec.ts --project=desktop-chrome
