name: Teacher notice production health

on:
  schedule:
    # The delivery worker runs on minute 0/5. Offset the monitor so its bounded
    # retry window observes a completed durable heartbeat instead of colliding
    # with the worker. Probe every worker interval so a later success cannot
    # systematically hide an intervening failed heartbeat.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
    inputs:
      alert_drill:
        description: Intentionally fail after healthy checks to verify the alert path
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: teacher-notice-production-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    # Store TEACHER_NOTICE_HEALTH_SECRET only in this environment. Configure
    # its deployment-branch policy to protected main; do not duplicate the
    # credential as a repository-level Actions secret.
    environment: production-health
    timeout-minutes: 5
    steps:
      - name: Check out the default branch monitor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind the monitor to protected main
        run: |
          test "$GITHUB_REPOSITORY" = "HUDongpin/MAIS-MVP"
          case "$GITHUB_EVENT_NAME" in schedule|workflow_dispatch) ;; *) exit 1 ;; esac
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_WORKFLOW_REF" = "HUDongpin/MAIS-MVP/.github/workflows/teacher-notice-health-monitor.yml@refs/heads/main"
          test "${#GITHUB_SHA}" -eq 40
          case "$GITHUB_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check aggregate teacher-notice health on both production aliases
        id: health_check
        continue-on-error: true
        env:
          TEACHER_NOTICE_HEALTH_SECRET: ${{ secrets.TEACHER_NOTICE_HEALTH_SECRET }}
        run: >-
          node scripts/monitor-teacher-notice-health.mjs
          ${{ inputs.alert_drill && '--drill-failure' || '' }}

      - name: Open one deduplicated production-health alert
        if: ${{ steps.health_check.outcome == 'failure' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = "MAIS teacher-notice production health alert";
            const marker = "<!-- mais-teacher-notice-health-alert-v1 -->";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find((issue) =>
              issue.title === title && String(issue.body ?? "").includes(marker)
            );
            if (!existing) {
              const drill = context.payload.inputs?.alert_drill === true ||
                context.payload.inputs?.alert_drill === "true";
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: [
                  marker,
                  "The authenticated read-only health monitor failed on at least one approved production alias.",
                  drill ? "Trigger: explicit alert drill." : "Trigger: scheduled or manual health check.",
                  `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                  "No application credentials or response bodies are included in this alert."
                ].join("\n\n")
              });
            }

      - name: Close the alert after a healthy recovery check
        if: ${{ steps.health_check.outcome == 'success' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = "MAIS teacher-notice production health alert";
            const marker = "<!-- mais-teacher-notice-health-alert-v1 -->";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            for (const issue of issues.filter((candidate) =>
              candidate.title === title && String(candidate.body ?? "").includes(marker)
            )) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Recovered on healthy run ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}.`
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed"
              });
            }

      - name: Keep the workflow red after alert delivery
        if: ${{ always() && steps.health_check.outcome == 'failure' }}
        run: exit 1
